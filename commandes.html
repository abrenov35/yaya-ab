<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Commandes — Yaya</title>
<style>
:root{--navy:#162D49;--gold:#C9A227;--bg:#F5F4F0;--red:#B3352C}
*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--navy)}
.hdr{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}.hdr b{font-size:20px}.back{margin-left:auto;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:7px;padding:8px 12px;font-weight:700;cursor:pointer}
.body{max-width:980px;margin:0 auto;padding:18px 12px 28px}.title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.title h1{font-size:18px;margin:0}.count{font-size:12px;opacity:.65}
.list{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(22,45,73,.10)}
.head,.row{display:grid;grid-template-columns:minmax(135px,1fr) minmax(220px,2fr) minmax(150px,1.2fr) 100px 90px 64px;gap:10px;align-items:center;padding:9px 10px}.head{font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;opacity:.62;border-bottom:1px solid rgba(22,45,73,.12)}.row{font-size:12.5px;border-bottom:1px solid rgba(22,45,73,.08)}.row:last-child{border-bottom:none}.supplier{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.desc,.site{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.desc{color:#4b5563}.amount{text-align:right;font-weight:700;white-space:nowrap}.date{text-align:right;font-size:11px;opacity:.65;white-space:nowrap}.voir{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:12px;border:1px solid rgba(201,162,39,.55);background:rgba(201,162,39,.14);color:#7d630e;cursor:pointer}.empty,.err{padding:24px 12px}.err{color:var(--red)}
@media(max-width:760px){.body{overflow-x:auto}.list{min-width:760px}.hdr{position:static}}
</style>
</head>
<body>
<div class="hdr"><b>🛒 Commandes</b><button class="back" onclick="location.href='./#chantiers'">Retour Yaya</button></div>
<div class="body"><div class="title"><h1>Commandes</h1><span class="count" id="count">Chargement…</span></div><div class="list" id="list"><div class="empty">Chargement…</div></div></div>
<script>
'use strict';
const API='https://script.google.com/macros/s/AKfycbx6IwMFf2plAq7i8qf8qF6f6MMC-1-WynAqn1ZRqCZrVqHeE9a1ygSSTzp5uOf0L3bn/exec';
const esc=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const eur=v=>(Number(v||0)||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate=v=>{const s=String(v||'');const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[3]+'/'+m[2]+'/'+m[1]:(s||'—')};
(async()=>{
  try{
    const sep=API.includes('?')?'&':'?';
    const r=await fetch(API+sep+'_commandes='+Date.now(),{cache:'no-store'});
    const txt=await r.text();
    const j=JSON.parse(txt);
    if(!j.ok)throw new Error(j.error||'Réponse API invalide');
    const data=j.data||{};
    const chantiers=Array.isArray(data.chantiers)?data.chantiers:[];
    const commandes=(Array.isArray(data.commandes)?data.commandes:[]).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||String(b.id||'').localeCompare(String(a.id||'')));
    const chantier=id=>{const c=chantiers.find(x=>String(x.id||'')===String(id||''));return c?(c.nom||c.numero||'—'):'—'};
    document.getElementById('count').textContent=commandes.length+' enregistrée'+(commandes.length>1?'s':'');
    const list=document.getElementById('list');
    if(!commandes.length){list.innerHTML='<div class="empty">Aucune commande enregistrée.</div>';return;}
    let html='<div class="head"><span>Fournisseur</span><span>Description</span><span>Chantier</span><span style="text-align:right">Montant HT</span><span style="text-align:right">Date</span><span></span></div>';
    commandes.forEach((c,i)=>{const lien=String(c.lien||c.oneDriveWebUrl||'').trim();html+='<div class="row"><span class="supplier">'+esc(c.fournisseur||'—')+'</span><span class="desc" title="'+esc(c.designation||'')+'">'+esc(c.designation||'—')+'</span><span class="site">'+esc(chantier(c.chantierId))+'</span><span class="amount">'+eur(c.montantHT)+' €</span><span class="date">'+esc(fmtDate(c.date))+'</span><span>'+(lien?'<button class="voir" data-i="'+i+'">VOIR</button>':'')+'</span></div>'});
    list.innerHTML=html;
    list.querySelectorAll('.voir').forEach(btn=>btn.onclick=()=>{const c=commandes[Number(btn.dataset.i)];const url=String(c.lien||c.oneDriveWebUrl||'').trim();if(url)window.open(url,'_blank','noopener,noreferrer')});
  }catch(e){document.getElementById('count').textContent='Erreur';document.getElementById('list').innerHTML='<div class="err">'+esc(e.message||e)+'</div>'}
})();
</script>
</body>
</html>
