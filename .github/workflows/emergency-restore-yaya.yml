name: Emergency restore Yaya
'on': [push]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove faulty loader line
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          lines = p.read_text(encoding="utf-8").splitlines()
          lines = [x for x in lines if "finance-delete-fallback-v1.js" not in x]
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")
      - name: Commit restore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Emergency restore Yaya loading"
          git push
