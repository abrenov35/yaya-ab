name: Publier AB COMMANDES intégré

on:
  push:
    paths:
      - '.github/workflows/bump-ab-commandes-embed.yml'
      - 'tools/bump_ab_commandes_embed.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mettre à jour le chargement AB COMMANDES
        run: python tools/bump_ab_commandes_embed.py
      - name: Publier sans conflit avec les mises à jour de version
        run: |
          git config user.name "Yaya automation"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python tools/bump_ab_commandes_embed.py

            if git diff --quiet; then
              echo "Aucun changement"
              exit 0
            fi

            git add index.html chantier-tabs-soft-theme.js
            git commit -m "Yaya - actualiser le module Commandes"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Conflit de publication, nouvelle tentative..."
            sleep 2
          done

          echo "Échec de publication après 3 tentatives"
          exit 1
