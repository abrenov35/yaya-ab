name: Publier AB COMMANDES intégré

on:
  push:
    paths:
      - '.github/workflows/bump-ab-commandes-embed.yml'
      - 'tools/bump_ab_commandes_embed.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mettre à jour le chargement AB COMMANDES
        run: python tools/bump_ab_commandes_embed.py
      - name: Publier
        run: |
          if git diff --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "Yaya automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Yaya v205.576 - AB COMMANDES intégré"
          git push
