name: Install V40 signature bridge

on:
  push:
    paths:
      - '.github/workflows/install-v39-signature-bridge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Activer sigbridge-2
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          pattern=r'chantier-signature-sheet-refresh\.js\?v=[A-Za-z0-9._-]+'
          new='chantier-signature-sheet-refresh.js?v=sigbridge-2'
          if not re.search(pattern,text):
              raise SystemExit('Tag chantier-signature-sheet-refresh introuvable')
          text=re.sub(pattern,new,text,count=1)
          p.write_text(text,encoding='utf-8')
          PY

      - name: Publier V40 avec retry
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Tag déjà actif"
            exit 0
          fi
          git config user.name "Yaya automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Yaya V40 - activer sigbridge-2"
          for n in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((n*2))
          done
          echo "Push V40 impossible après 5 tentatives" >&2
          exit 1

      - name: Confirmer
        run: echo "sigbridge-2 activé"
