name: Fix taille Fiche inter
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-fiche-inter-size.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Uniformiser Fiche inter avec les onglets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.fiche-inter-tab{border:1px solid rgba(255,255,255,.35);background:transparent;border-radius:7px;padding:7px 13px;font-size:13px;font-weight:600;color:#fff;font-family:inherit;cursor:pointer}.fiche-inter-tab:hover{background:rgba(255,255,255,.08)}'
          new='.fiche-inter-tab{position:relative!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:7px!important;min-width:140px!important;height:42px!important;padding:0 16px!important;border:1px solid #7d91c7!important;border-radius:7px!important;background:#294796!important;color:#fff!important;box-shadow:none!important;font-size:13px!important;font-weight:700!important;line-height:1!important;white-space:nowrap!important;font-family:inherit;cursor:pointer;text-decoration:none!important}.fiche-inter-tab:hover{background:#3453a2!important}@media(max-width:1050px){.fiche-inter-tab{min-width:auto!important;padding:0 13px!important}}'
          if old not in s:
              raise SystemExit('CSS fiche-inter-tab introuvable')
          s=s.replace(old,new,1)
          s=s.replace('id="yayaVersion">V181<','id="yayaVersion">V182<',1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff -- index.html
      - name: Commit
        run: |
          git config user.name 'GitHub Actions'
          git config user.email 'github-actions@github.com'
          git add index.html
          git diff --cached --quiet && exit 1
          git commit -m 'Yaya V182: uniformise le bouton Fiche inter'
          git push
