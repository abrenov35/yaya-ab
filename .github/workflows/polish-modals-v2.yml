name: Polish Yaya modals v2

on:
  push:
    branches: [main]
    paths:
      - '.modal-trigger'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve modal layout and readability
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</style>'
          css = r'''
          
          /* ===== MODALES YAYA — finition pro ===== */
          .overlay{align-items:center !important;justify-content:center !important;padding:24px !important;background:rgba(13,32,54,.56) !important;backdrop-filter:blur(2px)}
          .modal{width:min(620px,calc(100vw - 32px)) !important;max-height:calc(100vh - 48px);overflow-y:auto;border-radius:16px !important;padding:22px !important;border:1px solid rgba(22,45,73,.10);box-shadow:0 22px 60px rgba(13,32,54,.28) !important}
          .modal h5{margin:0 0 18px !important;min-height:34px;display:flex !important;align-items:center !important;justify-content:space-between !important;gap:16px;font-size:16px !important;font-weight:750;color:var(--navy);border-bottom:1px solid rgba(22,45,73,.10);padding-bottom:12px}
          .modal h5 button{flex:0 0 auto;min-height:34px}
          .modal .row{gap:10px !important;margin-bottom:12px !important;align-items:center !important}
          .modal .mrow{gap:10px !important;margin-top:10px !important;align-items:center !important}
          .modal .inp,.modal .msel,.modal .mnum{min-height:40px;border:1px solid rgba(22,45,73,.24) !important;border-radius:9px !important;background:#fff;color:var(--navy);outline:none;transition:border-color .15s ease,box-shadow .15s ease}
          .modal .inp:focus,.modal .msel:focus,.modal .mnum:focus{border-color:var(--gold) !important;box-shadow:0 0 0 3px rgba(201,162,39,.13)}
          .modal label{color:#536273 !important;font-size:11.5px !important;font-weight:700 !important}
          .modal .btnp,.modal .btn2,.modal .btn-valid{min-height:38px;border-radius:9px !important}
          .modal .btnp.go{box-shadow:0 2px 8px rgba(46,125,70,.18)}
          .modal .note{line-height:1.45}
          .modal .mfoot{padding-top:8px;margin-top:16px !important;border-top:1px solid rgba(22,45,73,.08)}
          @media(max-width:640px){.overlay{align-items:flex-start !important;padding:12px !important}.modal{width:100% !important;max-width:none !important;max-height:calc(100vh - 24px);padding:16px !important;border-radius:14px !important}.modal .row,.modal .mrow{align-items:stretch !important}.modal .inp,.modal .msel,.modal .mnum{min-height:42px}}
          '''
          css='\n'.join(line[10:] if line.startswith('          ') else line for line in css.splitlines())
          if '/* ===== MODALES YAYA — finition pro ===== */' not in s:
              if marker not in s:
                  raise SystemExit('Balise style introuvable')
              s = s.replace(marker, css + '\n' + marker, 1)
          # Garder les listes chantier A-Z dans Achats et Documents
          s = s.replace('S.chantiers.filter(c=>c.statut!=="Terminé"&&c.statut!=="Archivé").map(c=>', 'S.chantiers.filter(c=>c.statut!=="Terminé"&&c.statut!=="Archivé").sort((a,b)=>String(a.nom||\'\').localeCompare(String(b.nom||\'\'),\'fr\',{sensitivity:\'base\'})).map(c=>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Modales centrées, lisibles et professionnelles"
          git push
