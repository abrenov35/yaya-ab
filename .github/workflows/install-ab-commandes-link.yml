name: Installer lien AB COMMANDES

on:
  push:
    paths:
      - '.github/workflows/install-ab-commandes-link.yml'
      - 'tools/install_ab_commandes_link.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer le lien sous les onglets chantier
        run: python tools/install_ab_commandes_link.py
      - name: Publier sans conflit
        run: |
          if git diff --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "Yaya automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Yaya - charger AB COMMANDES v3"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 2; continue; }
            if git push; then
              exit 0
            fi
            sleep 2
          done
          echo "Échec de publication après 5 tentatives"
          exit 1
