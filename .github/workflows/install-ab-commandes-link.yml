name: Installer lien AB COMMANDES

on:
  push:
    paths:
      - '.github/workflows/install-ab-commandes-link.yml'
      - 'tools/install_ab_commandes_link.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer le lien sous les onglets chantier
        run: python tools/install_ab_commandes_link.py
      - name: Publier
        run: |
          if git diff --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "Yaya automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Yaya v205.572 - lien AB COMMANDES chantier"
          git push
