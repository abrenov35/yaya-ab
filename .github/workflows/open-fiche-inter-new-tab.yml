name: Open Fiche inter in new tab

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/open-fiche-inter-new-tab.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Fiche inter link only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "onclick=\"event.stopPropagation();window.location.assign('https://abrenov35.github.io/docs-chantier-ab/');return false;\""
          new = "onclick=\"event.stopPropagation();window.open('https://abrenov35.github.io/docs-chantier-ab/','_blank','noopener');return false;\""
          if old not in s:
              raise SystemExit('Bouton Fiche inter introuvable ou déjà modifié')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Ouvre Fiche inter dans un nouvel onglet"
          git push
