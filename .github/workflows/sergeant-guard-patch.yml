name: Sergeant duplicate guard patch

on:
  push:
    paths:
      - '.github/workflows/sergeant-guard-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secure chantier deletion and load duplicate guard
        shell: python
        run: |
          from pathlib import Path

          delete_path = Path('chantier-delete-confirm-fix.js')
          text = delete_path.read_text(encoding='utf-8')

          marker = "  async function verifierSuppressionServeur(id){"
          helper = r'''  async function chargerEtatServeurAvantSuppression(id){
            if(typeof apiGet!=='function')return null;
            const fresh=await apiGet(true);
            const list=Array.isArray(fresh&&fresh.chantiers)?fresh.chantiers:[];
            const matches=list.filter(function(c){return String(c.id)===String(id);});
            if(matches.length===0)throw new Error('chantier absent du serveur');
            if(matches.length>1)throw new Error('doublon technique du même identifiant');
            return fresh;
          }

'''
          if 'chargerEtatServeurAvantSuppression' not in text:
              if marker not in text:
                  raise SystemExit('Delete helper insertion marker not found')
              text = text.replace(marker, helper + marker, 1)

          old = """    const confirme=await confirmationCentree(id);\n    if(!confirme)return;\n\n    suppressionEnCours=true;\n"""
          new = """    const confirme=await confirmationCentree(id);\n    if(!confirme)return;\n\n    try{\n      const fresh=await chargerEtatServeurAvantSuppression(id);\n      if(fresh&&typeof fresh==='object'){\n        if(Array.isArray(fresh.chantiers))S.chantiers=fresh.chantiers;\n        if(Array.isArray(fresh.achats))S.achats=fresh.achats;\n        if(Array.isArray(fresh.avenants))S.avenants=fresh.avenants;\n      }\n    }catch(e){\n      if(typeof toast==='function')toast('Suppression bloquée : '+(e&&e.message?e.message:'état serveur invalide'),true);\n      console.error('Suppression chantier bloquée avant écriture :',e);\n      return;\n    }\n\n    suppressionEnCours=true;\n"""
          if new not in text:
              if old not in text:
                  raise SystemExit('Delete preflight replacement marker not found')
              text = text.replace(old, new, 1)

          delete_path.write_text(text, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('chantier-delete-confirm-fix.js?v=deletechantier-4', 'chantier-delete-confirm-fix.js?v=deletechantier-5')
          loader = '<script src="chantier-duplicate-display-guard.js?v=dupguard-1"><\\/script>'
          anchor = '<script src="chantier-delete-confirm-fix.js?v=deletechantier-5"><\\/script>'
          if loader not in index:
              if anchor not in index:
                  raise SystemExit('Index delete loader anchor not found')
              index = index.replace(anchor, anchor + loader, 1)
          index_path.write_text(index, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chantier-delete-confirm-fix.js index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Sécurise la suppression des doublons chantier"
          git push
