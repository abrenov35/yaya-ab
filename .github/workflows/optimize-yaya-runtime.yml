name: Optimiser runtime Yaya

on:
  push:
    paths:
      - '.github/workflows/optimize-yaya-runtime.yml'
      - 'tools/optimize_yaya_runtime.py'
      - 'tools/audit_yaya_performance.py'
      - 'documents-background-sync-v1.js'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Optimiser le runtime
        run: python tools/optimize_yaya_runtime.py

      - name: Auditer les ralentissements restants
        run: python tools/audit_yaya_performance.py

      - name: Publier sans conflit
        run: |
          git config user.name "Yaya automation"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python tools/optimize_yaya_runtime.py

            if git diff --quiet; then
              echo "Aucun changement"
              exit 0
            fi

            git add index.html index-production-base.html index-legacy.html \
              chantier-tabs-soft-theme.js colored-view-eyes.js \
              mails-page-last10.js mail-edit-sync-fix.js

            git commit -m "Yaya - optimiser le runtime et les tâches de fond"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Conflit, nouvelle tentative..."
            sleep 2
          done

          echo "Échec de publication après 3 tentatives"
          exit 1
