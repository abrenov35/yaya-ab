name: Cache-bust edit modal fix

on:
  push:
    paths:
      - '.github/workflows/tmp-cache-bust-edit-modal.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index loader versions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = s
          s = s.replace('chantier-planning-status-fix.js?v=planningstatus-3', 'chantier-planning-status-fix.js?v=planningstatus-4')
          s = s.replace('chantier-save-close-patch.js?v=saveclose-1', 'chantier-save-close-patch.js?v=saveclose-2')
          if s == old:
              raise SystemExit('Expected loader versions not found')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit safely
        shell: bash
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            git add index.html
            git diff --cached --quiet || git commit -m "Force le chargement du correctif modale chantier"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1
