name: YAYA typographie responsive

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'YAYA V205.651 - typographie responsive'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Charger le patch typographique en dernier
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'responsive-typography.js?v=1' not in s:
              lines=s.splitlines(True)
              tag=r'''    '<script src="responsive-typography.js?v=1"><\/script>'+'''+'\n'
              pos=None
              for i,line in enumerate(lines):
                  if 'devis-document-link-fix.js?v=linkfix-9' in line:
                      pos=i+1
              if pos is None:
                  raise SystemExit('Point insertion typographie introuvable')
              lines.insert(pos,tag)
              s=''.join(lines)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "abrenov35"
          git config user.email "abrenov35@gmail.com"
          git add index.html
          git diff --cached --quiet || git commit -m "YAYA V205.651 - publier typographie responsive"
          git push
