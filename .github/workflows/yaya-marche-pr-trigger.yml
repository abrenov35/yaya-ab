name: Yaya - appliquer marche HT via PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-main:
    if: github.event.pull_request.title == '[YAYA] APPLY MARCHE HT'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace(
            'S.chantiers.forEach(c=>{ c.montantDevisHT=Number(c.montantDevisHT)||0; });',
            'S.chantiers.forEach(c=>{ c.montantDevisHT=Number(c.montantDevisHT)||0; c.montantMarcheHT=Number(c.montantMarcheHT)||0; });'
          )
          s=s.replace(
            'function totalDevis(c){ return (c.montantDevisHT||0)+avenantsChantier(c.id).reduce((t,v)=>t+v.montantHT,0); }',
            'function totalDevis(c){ return Number(c&&c.montantMarcheHT)||0; }'
          )
          s=s.replace(
            'S.chantiers.push({id:nid,nom,numero,montantDevisHT:devis,statut:"En cours",notes:devisLien});',
            'S.chantiers.push({id:nid,nom,numero,montantDevisHT:devis,montantMarcheHT:0,statut:"En cours",notes:devisLien});'
          )

          s=s.replace(
            'f+=\'<div class="seclabel"><span>March&eacute;</span><span>\'+eur(devisTot)+\' &euro;</span></div>\';',
            'f+=\'<div class="seclabel"><span>March&eacute;</span><span class="editable" title="Modifier le montant officiel du marché HT" onclick="editMontantMarche(\\\'\'+c.id+\'\\\')" style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px">\'+eur(devisTot)+\' &euro;</span></div>\';'
          )
          s=s.replace(
            'html+=\'<div class="seclabel"><span>Marché</span><span>\'+eur(devisTot)+\' €</span></div>\';',
            'html+=\'<div class="seclabel"><span>Marché</span><span class="editable" title="Modifier le montant officiel du marché HT" onclick="editMontantMarche(\\\'\'+c.id+\'\\\')" style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px">\'+eur(devisTot)+\' €</span></div>\';'
          )

          if 'async function editMontantMarche(cid)' not in s:
            anchor='function demanderMontant(actuel){'
            fn='''async function editMontantMarche(cid){
  const c=chantierById(cid); if(!c) return;
  const v=prompt("Montant officiel du marché HT (en euros) :", Number(c.montantMarcheHT)||0);
  if(v===null) return;
  const propre=String(v).trim().replace(/\\s/g,"").replace(",",".");
  if(propre===""){ toast("Indique un montant HT",true); return; }
  const montant=Number(propre);
  if(!Number.isFinite(montant)||montant<0){ toast("Montant HT invalide",true); return; }
  const avant=Number(c.montantMarcheHT)||0;
  c.montantMarcheHT=montant;
  render();
  if(await apiPost("setChantiers",S.chantiers)) toast("Montant du marché HT enregistré ✓");
  else { c.montantMarcheHT=avant; render(); }
}

'''
            if anchor in s:
              s=s.replace(anchor,fn+anchor,1)

          s=s.replace('toast("Devis 1 ajouté ✓ (marché HT mis à jour)")','toast("Devis 1 ajouté ✓")')
          s=s.replace('toast("Devis ajouté ✓ (marché HT mis à jour)")','toast("Devis ajouté ✓")')
          s=s.replace('if(!confirm("Supprimer ce devis ? Le marché HT du chantier sera recalculé.")) return;','if(!confirm("Supprimer ce devis ?")) return;')

          if 'montantMarcheHT' not in s or 'editMontantMarche' not in s:
            raise SystemExit('Patch marché HT non appliqué')

          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit et push main
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Yaya V195: dissocie le marché HT des devis"
          git push origin main
