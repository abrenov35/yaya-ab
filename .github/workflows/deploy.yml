name: Auto-increment version

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: yaya-version-bump
  cancel-in-progress: false

jobs:
  increment-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Increment visible Yaya version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          version_file = Path('version.txt')
          current = version_file.read_text(encoding='utf-8').strip() if version_file.exists() else '205.3'
          m = re.fullmatch(r'(\d+)\.(\d+)', current)
          if not m:
              raise SystemExit(f'Version invalide: {current!r}')

          major = int(m.group(1))
          minor = int(m.group(2)) + 1
          new_version = f'{major}.{minor}'
          version_file.write_text(new_version + '\n', encoding='utf-8')
          print(f'Yaya {current} -> {new_version}')

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          loader = '<script src="version-indicator.js?v=version-1"><\\/script>'
          if 'version-indicator.js' not in s:
              anchor = '<script src="header-sticky-toolbar.js?v=sticky-2"><\\/script>'
              if anchor not in s:
                  raise SystemExit('Point insertion version-indicator introuvable dans index.html')
              s = s.replace(anchor, anchor + loader, 1)
              index.write_text(s, encoding='utf-8')
          PY

      - name: Commit & push version
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add version.txt index.html
          git commit -m "Bump Yaya visible version" || echo "No change"
          git push
