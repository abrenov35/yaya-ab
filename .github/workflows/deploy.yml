name: Auto-increment version

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: yaya-version-bump
  cancel-in-progress: false

jobs:
  increment-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Increment visible Yaya version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('version.txt')
          current = p.read_text(encoding='utf-8').strip() if p.exists() else '205.3'
          m = re.fullmatch(r'(\d+)\.(\d+)', current)
          if not m:
              raise SystemExit(f'Version invalide: {current!r}')

          new_version = f'{int(m.group(1))}.{int(m.group(2)) + 1}'
          p.write_text(new_version + '\n', encoding='utf-8')
          print(f'Yaya {current} -> {new_version}')
          PY

      - name: Commit & push version
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add version.txt
          git commit -m "Bump Yaya visible version" || echo "No change"
          git push
