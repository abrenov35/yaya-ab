name: Install finance delete fallback
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-finance-delete-fallback.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add fallback script to Yaya
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          marker = '<script src="finance-delete-fallback-v1.js?v=1"><\/script>'
          if marker not in s:
              anchor = '    \'<script src="finance-background-save-delete-v1.js?v=bgfinance-5"><\\/script>\'+'
              addition = anchor + "\n" + '    \'<script src="finance-delete-fallback-v1.js?v=1"><\\/script>\'+'
              if anchor not in s:
                  raise SystemExit("Finance script anchor not found")
              p.write_text(s.replace(anchor, addition, 1), encoding="utf-8")
      - name: Commit activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Activate purchase and charge deletion fallback"
          git push
