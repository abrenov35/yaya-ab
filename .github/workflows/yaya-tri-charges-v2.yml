name: Yaya - tri charges chantier v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yaya-tri-charges-v2.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trier réellement les charges par date décroissante
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='const ach=achatsChantier(c.id);'
          new="""const ach=achatsChantier(c.id).map((a,i)=>({a,i})).sort((x,y)=>{
        const dx=String(x.a.horodatage||x.a.createdAt||x.a.dateCreation||x.a.date||'');
        const dy=String(y.a.horodatage||y.a.createdAt||y.a.dateCreation||y.a.date||'');
        return dy.localeCompare(dx)||y.i-x.i;
      }).map(x=>x.a);"""
          n=s.count(old)
          if n==0:
              raise SystemExit('Aucune occurrence à modifier')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          print(f'{n} occurrence(s) modifiée(s)')
          PY
      - name: Vérifier le diff
        run: git diff -- index.html
      - name: Commit and push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add index.html
          git diff --cached --quiet && exit 1
          git commit -m "Yaya: affiche les charges les plus récentes en premier"
          git push
