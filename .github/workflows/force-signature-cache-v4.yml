name: Force signature cache v4

on:
  push:
    paths:
      - '.github/workflows/force-signature-cache-v4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force les nouveaux scripts signatures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('chantier-signature-before-sept.js?v=beforesept-3', 'chantier-signature-before-sept.js?v=beforesept-4')
          text = text.replace('chantier-signature-sheet-refresh.js?v=sigfresh-2', 'chantier-signature-sheet-refresh.js?v=sigfresh-4')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Publier le cache-bust signatures
        run: |
          if git diff --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "Yaya automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Yaya - forcer chargement signatures colonne J"
          git pull --rebase origin main
          git push origin main
