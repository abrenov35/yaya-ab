name: Yaya lecteur Commande parent correctif

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Yaya - activer definitivement lecteur Commande parent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Injecter le pont de preview Commande
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          target='ab-commandes-parent-preview.js?v=cmd-parent-92'
          if target not in s:
              lines=s.splitlines(True)
              for i,line in enumerate(lines):
                  if 'yaya-ab-commandes-link.js?v=commandes-link-16' in line:
                      indent=line[:len(line)-len(line.lstrip())]
                      lines.insert(i+1, indent+'\'<script src="ab-commandes-parent-preview.js?v=cmd-parent-92"><\\/script>\'+\n')
                      break
              else:
                  raise SystemExit('ligne yaya-ab-commandes-link introuvable')
              s=''.join(lines)
          s=re.sub(r'Yaya v205\.\d+ — AB RENOV 35','Yaya v205.667 — AB RENOV 35',s,count=1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit index
        run: |
          git config user.name 'abrenov35'
          git config user.email 'abrenov35@gmail.com'
          git add index.html
          git commit -m 'Yaya v205.667 - lecteur Commande parent actif' || exit 0
          git push
