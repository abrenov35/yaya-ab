name: Install evolution dashboard V45

on:
  push:
    paths:
      - '.github/workflows/install-evolution-dashboard-v45.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install dashboard script
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'evolution-ca-dashboard-v2.js?v=dashboard-v45' not in s:
              lines = s.splitlines()
              out = []
              inserted = False
              for line in lines:
                  out.append(line)
                  if not inserted and 'evolution-ca-2026-patch.js' in line:
                      indent = line[:len(line)-len(line.lstrip())]
                      out.append(indent + "'<script src=\"evolution-ca-dashboard-v2.js?v=dashboard-v45\"><\\\\/script>'+" )
                      inserted = True
              if not inserted:
                  raise SystemExit('Ligne evolution introuvable')
              s = '\n'.join(out) + '\n'

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit V45
        run: |
          if git diff --quiet; then
            echo 'Déjà installé'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'V45 - activer la nouvelle présentation du CA signé'
          git push origin main
