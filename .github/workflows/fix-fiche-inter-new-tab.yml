name: Fix Fiche inter new tab

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-fiche-inter-new-tab.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Fiche inter link only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          new='<a class="fiche-inter-tab" href="https://abrenov35.github.io/docs-chantier-ab/" target="_blank" rel="noopener noreferrer" style="text-decoration:none;display:inline-flex;align-items:center">Fiche inter</a>'
          pattern=r'<(?:button|a)[^>]*class="fiche-inter-tab"[^>]*>Fiche inter</(?:button|a)>'
          s2,n=re.subn(pattern,new,s,count=1)
          if n!=1:
              raise SystemExit('Élément Fiche inter introuvable')
          p.write_text(s2,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Ouvre Fiche inter dans un nouvel onglet"
          git push
