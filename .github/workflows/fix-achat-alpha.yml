name: Fix Achats modal chantier sort

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-achat-alpha.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Achats modal only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='function openAchatModal(){'
          start=s.index(marker)
          end=s.index('function openDocumentModal(){', start)
          block=s[start:end]
          old='''S.chantiers.filter(c=>c.statut!=="Terminé"&&c.statut!=="Archivé").map(c=>'<option value="'+c.id+'">'+esc(c.nom)+' ('+esc(c.numero)+')</option>').join('')'''
          new='''S.chantiers.filter(c=>c.statut!=="Terminé"&&c.statut!=="Archivé").sort((a,b)=>String(a.nom||'').localeCompare(String(b.nom||''),'fr',{sensitivity:'base'})).map(c=>'<option value="'+c.id+'">'+esc(c.nom)+' ('+esc(c.numero)+')</option>').join('')'''
          if old not in block:
              raise SystemExit('Pattern Achats introuvable dans openAchatModal')
          block=block.replace(old,new,1)
          s=s[:start]+block+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Tri A-Z des chantiers dans la modale Achats"
          git push
