name: Add Fiche inter button

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-fiche-inter.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Fiche inter to toolbar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          needle='    <button class="tab" data-tab="equipe">Équipe</button>\n'
          addition='    <button class="tab" type="button" onclick="window.location.href=\'https://abrenov35.github.io/docs-chantier-ab\'">Fiche inter</button>\n'
          if addition not in s:
              if needle not in s:
                  raise SystemExit('Barre Yaya introuvable')
              s=s.replace(needle, needle+addition, 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Ajoute Fiche inter dans la barre Yaya"
          git push
