name: Fix Evolution axis 250k
on:
  push:
    paths:
      - '.github/workflows/fix-evolution-axis-250k.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix axis to 250k
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('evolution-ca-dashboard-v2.js')
          s=p.read_text()
          old='const axisMax=roundAxis(maxChart);'
          new='const axisMax=250000;'
          if old not in s:
              raise SystemExit('Point insertion axisMax introuvable')
          p.write_text(s.replace(old,new,1))
          p=Path('index.html')
          s=p.read_text()
          old='evolution-ca-dashboard-v2.js?v=dashboard-v45'
          new='evolution-ca-dashboard-v2.js?v=dashboard-v46'
          if old not in s:
              raise SystemExit('Version dashboard introuvable dans index.html')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name 'Yaya automation'
          git config user.email 'actions@users.noreply.github.com'
          git add evolution-ca-dashboard-v2.js index.html
          git diff --cached --quiet || git commit -m 'Yaya - échelle graphique Evolution 250 k€ par mois'
          git push