name: Diagnose Planning signatures

on:
  push:
    paths:
      - '.github/workflows/diag-planning-signatures.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: List Planning signatures
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url='https://script.google.com/macros/s/AKfycbxOE2bAsnGKn1TvOlxBK1qJpe2nblhC4l8YWmAxTUe3VM383YaNrPmH3i1U2g-Sp7LJxA/exec?action=getChantiers'
          req=urllib.request.Request(url,headers={'User-Agent':'Yaya-Planning-Diagnostic/2.0'})
          with urllib.request.urlopen(req,timeout=60) as r:
              payload=json.loads(r.read().decode('utf-8','replace').strip())
          rows=payload if isinstance(payload,list) else payload.get('chantiers') or (payload.get('data') or {}).get('chantiers') or []
          objs=[x for x in rows if isinstance(x,dict)]
          signed=[o for o in objs if str(o.get('dateSignature') or '').strip()]
          print('signed='+str(len(signed)))
          for o in signed:
              print('SIG|'+str(o.get('id') or '')+'|'+str(o.get('nom') or '')+'|'+str(o.get('dateSignature') or ''))
          PY
