name: Diagnose Planning signatures

on:
  push:
    paths:
      - '.github/workflows/diag-planning-signatures.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check Planning signature fields
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url='https://script.google.com/macros/s/AKfycbxOE2bAsnGKn1TvOlxBK1qJpe2nblhC4l8YWmAxTUe3VM383YaNrPmH3i1U2g-Sp7LJxA/exec?action=getChantiers'
          req=urllib.request.Request(url,headers={'User-Agent':'Yaya-Planning-Diagnostic/1.0'})
          with urllib.request.urlopen(req,timeout=60) as r:
              raw=r.read().decode('utf-8','replace').strip()
          try:
              payload=json.loads(raw)
          except Exception:
              print('not_json=true')
              print(raw[:500])
              raise
          rows=payload if isinstance(payload,list) else payload.get('chantiers') or (payload.get('data') or {}).get('chantiers') or []
          objs=[x for x in rows if isinstance(x,dict)]
          keys=sorted(set().union(*(o.keys() for o in objs))) if objs else []
          vals=[str(o.get('dateSignature') or '').strip() for o in objs]
          print('rows='+str(len(objs)))
          print('keys='+','.join(keys))
          print('dateSignature_field='+str(sum('dateSignature' in o for o in objs)))
          print('dateSignature_nonempty='+str(sum(bool(v) for v in vals)))
          PY
