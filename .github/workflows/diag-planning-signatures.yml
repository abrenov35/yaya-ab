name: Diagnose direct Sheet signatures

on:
  push:
    paths:
      - '.github/workflows/diag-planning-signatures.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check Google Sheets gviz access
        shell: bash
        run: |
          python3 - <<'PY'
          import re, urllib.request
          url='https://docs.google.com/spreadsheets/d/1qXlCwEpidF_66hGD_BM7GuETazKMJlGg0b-BEzCOt-Y/gviz/tq?tqx=out:json&sheet=chantiers&range=A:J'
          req=urllib.request.Request(url,headers={'User-Agent':'Yaya-Sheet-Diagnostic/1.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
              text=r.read().decode('utf-8','replace')
          print('status=ok')
          print('length='+str(len(text)))
          print('has_dateSignature='+str('dateSignature' in text).lower())
          print('has_before_sept='+str('AVANT_2026-09' in text).lower())
          print('has_angot='+str('ANGOT' in text.upper()).lower())
          if 'dateSignature' not in text or 'AVANT_2026-09' not in text:
              raise SystemExit('ERROR: direct Sheet response does not expose column J')
          PY
