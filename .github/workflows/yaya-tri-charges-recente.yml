name: Yaya - tri charges récentes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yaya-tri-charges-recente.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trier les charges du chantier du plus récent au plus ancien
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='const ach=achatsChantier(c.id);'
          new="""const ach=achatsChantier(c.id).map((a,i)=>({a,i})).sort((x,y)=>{
                  const dx=String(x.a.horodatage||x.a.createdAt||x.a.dateCreation||x.a.date||'');
                  const dy=String(y.a.horodatage||y.a.createdAt||y.a.dateCreation||y.a.date||'');
                  return dy.localeCompare(dx)||y.i-x.i;
                }).map(x=>x.a);"""
          count=s.count(old)
          if count<2:
              raise SystemExit(f'Occurrences attendues insuffisantes: {count}')
          s=s.replace(old,new,2)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Yaya: trie les charges chantier par date décroissante"
          git push
