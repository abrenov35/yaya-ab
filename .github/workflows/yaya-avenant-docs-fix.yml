name: Yaya - exclure charges de Documents

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yaya-avenant-docs-fix.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Filtrer les charges dans Documents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="const sorted=historiquePiecesYaya();"
          new="const sorted=historiquePiecesYaya().filter(d=>String(d.origine||'document')!=='charge');"
          if old not in s:
              raise SystemExit('Marqueur renderDocuments introuvable')
          s=s.replace(old,new,1)
          s=s.replace("Toutes les pièces connues de Yaya sont affichées ici, y compris celles liées aux charges.","Les pièces de charges restent disponibles dans Charges et dans la fiche du chantier.",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit et push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Yaya: masque les charges de la page Documents"
          git push
