name: Yaya - exclure les charges des Documents

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yaya-avenant-docs-fix.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Documents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""function historiquePiecesYaya(){
  const vus=new Set();
  const cleLien=l=>String(l||'').trim().replace(/[?&](dl|raw)=\\d/gi,'').replace(/[?&]$/,'');
  const pieces=[];
  (S.achats||[]).forEach((a,i)=>{
    const lien=String(a.lien||'').trim();
    if(!lien.startsWith('http'))return;
    const cle=cleLien(lien);if(cle&&vus.has(cle))return;if(cle)vus.add(cle);
    pieces.push({id:a.id,chantierId:a.chantierId,type:a.typeDoc||'Charge',titre:a.designation||'Pièce de charge',sujet:a.fournisseur||'Charge',date:a.date||'',lien,origine:'charge',ordre:i});
  });
  (S.documents||[]).forEach((d,i)=>{
    const lien=String(d.lien||'').trim();
    const cle=cleLien(lien);if(cle&&vus.has(cle))return;if(cle)vus.add(cle);
    pieces.push({...d,origine:'document',ordre:(S.documents.length-i)});
  });
  return pieces.sort((a,b)=>{
"""
          new="""function historiquePiecesYaya(){
  const vus=new Set();
  const cleLien=l=>String(l||'').trim().replace(/[?&](dl|raw)=\\d/gi,'').replace(/[?&]$/,'');
  const pieces=[];
  // La page Documents ne doit contenir que S.documents.
  // Les justificatifs de charges restent dans Charges et dans la fiche chantier.
  const liensCharges=new Set((S.achats||[]).map(a=>cleLien(a.lien)).filter(Boolean));
  (S.documents||[]).forEach((d,i)=>{
    const lien=String(d.lien||'').trim();
    const cle=cleLien(lien);
    if(cle&&liensCharges.has(cle))return;
    if(cle&&vus.has(cle))return;if(cle)vus.add(cle);
    pieces.push({...d,origine:'document',ordre:(S.documents.length-i)});
  });
  return pieces.sort((a,b)=>{
"""
          if old not in s:
              raise SystemExit('Bloc historiquePiecesYaya introuvable')
          s=s.replace(old,new,1)
          s=s.replace("Toutes les pièces connues de Yaya sont affichées ici, y compris celles liées aux charges.","Les justificatifs de charges sont disponibles dans Charges et dans la fiche du chantier.",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Yaya: exclut les justificatifs de charges de Documents"
          git push
