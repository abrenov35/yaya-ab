name: Fix Fiche inter link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-fiche-inter-link.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Fiche inter URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="onclick=\"window.location.href='https://abrenov35.github.io/docs-chantier-ab'\""
          new="onclick=\"window.location.href='https://abrenov35.github.io/docs-chantier-ab/'\""
          if old not in s:
              raise SystemExit('Lien Fiche inter introuvable')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Corrige le lien Fiche inter"
          git push
