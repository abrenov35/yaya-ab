name: Ajuster premier bloc Evolution

on:
  push:
    paths:
      - '.github/workflows/fix-evolution-first-block.yml'
      - 'tools/fix_evolution_first_block.py'

permissions:
  contents: write

jobs:
  fix-evolution-first-block:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ajuster le bloc Evolution
        run: python tools/fix_evolution_first_block.py

      - name: Publier sans conflit
        run: |
          git config user.name "Yaya automation"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python tools/fix_evolution_first_block.py

            if git diff --quiet; then
              echo "Aucun changement"
              exit 0
            fi

            git add evolution-ca-sticky-layout.js index.html
            git commit -m "Yaya - faire tenir le premier bloc Evolution"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Conflit, nouvelle tentative..."
            sleep 2
          done

          echo "Echec de publication apres 3 tentatives"
          exit 1
