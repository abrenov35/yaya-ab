name: Yaya aperçu document hauteur

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Yaya - aperçu document hauteur complète'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Charger le correctif aperçu dans Yaya
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag="    '<script src=\"piece-preview-fit-height.js?v=fitheight-1\"><\\/script>'+\n"
          anchor="    '<script src=\"piece-preview-size-patch.js?v=size-12\"><\\/script>'+\n"
          if 'piece-preview-fit-height.js?v=fitheight-1' not in s:
              if anchor not in s:
                  raise SystemExit('ancre piece-preview-size-patch introuvable')
              s=s.replace(anchor,anchor+tag,1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name "abrenov35"
          git config user.email "abrenov35@gmail.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Yaya - publier aperçu document hauteur complète"
            git push
          fi
