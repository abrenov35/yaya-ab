name: Diagnose Yaya signature API

on:
  push:
    paths:
      - '.github/workflows/diag-signature-api.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check Yaya meta endpoint
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          base = 'https://script.google.com/macros/s/AKfycbx6IwMFf2plAq7i8qf8qF6f6MMC-1-WynAqn1ZRqCZrVqHeE9a1ygSSTzp5uOf0L3bn/exec'
          req = urllib.request.Request(base + '?mode=meta&_diag=2', headers={'User-Agent':'Yaya-Diagnostic/2.0'})
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  payload = json.load(response)
          except Exception as exc:
              print('meta_endpoint=timeout_or_error')
              print('error_type=' + exc.__class__.__name__)
              raise

          print('api_ok=' + str(payload.get('ok') is True).lower())
          print('has_meta=' + str(isinstance(payload.get('meta'), dict)).lower())
          print('has_data=' + str(isinstance(payload.get('data'), dict)).lower())

          if not isinstance(payload.get('meta'), dict):
              raise SystemExit('ERROR: selective/meta backend is not deployed')
          PY
