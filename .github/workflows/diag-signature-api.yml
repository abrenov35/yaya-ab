name: Diagnose Yaya signature API

on:
  push:
    paths:
      - '.github/workflows/diag-signature-api.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check chantiers schema
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          base = 'https://script.google.com/macros/s/AKfycbx6IwMFf2plAq7i8qf8qF6f6MMC-1-WynAqn1ZRqCZrVqHeE9a1ygSSTzp5uOf0L3bn/exec'
          req = urllib.request.Request(base + '?tabs=chantiers&_diag=4', headers={'User-Agent':'Yaya-Diagnostic/4.0'})
          with urllib.request.urlopen(req, timeout=60) as response:
              payload = json.load(response)

          rows = ((payload.get('data') or {}).get('chantiers') or [])
          objects = [r for r in rows if isinstance(r, dict)]
          keys = sorted(set().union(*(r.keys() for r in objects))) if objects else []

          print('chantiers=' + str(len(rows)))
          print('keys=' + ','.join(keys))
          for field in ('modeSuivi','dateDemarrage','dateSignature','origine'):
              print(field + '_field=' + str(sum(field in r for r in objects)))
          PY
