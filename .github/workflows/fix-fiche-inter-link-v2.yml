name: Fix Fiche inter external link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-fiche-inter-link-v2.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Fiche inter button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''<button class="tab" type="button" onclick="window.location.href='https://abrenov35.github.io/docs-chantier-ab/'">Fiche inter</button>'''
          new='''<button class="fiche-inter-tab" type="button" onclick="event.stopPropagation();window.location.assign('https://abrenov35.github.io/docs-chantier-ab/');return false;">Fiche inter</button>'''
          if old not in s:
              raise SystemExit('Bouton Fiche inter introuvable')
          s=s.replace(old,new,1)
          css='''.fiche-inter-tab{border:1px solid rgba(255,255,255,.35);background:transparent;border-radius:7px;padding:7px 13px;font-size:13px;font-weight:600;color:#fff;font-family:inherit;cursor:pointer}.fiche-inter-tab:hover{background:rgba(255,255,255,.08)}'''
          marker='.tab.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}'
          if css not in s:
              s=s.replace(marker,marker+'\n'+css,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix Fiche inter external navigation"
          git push
