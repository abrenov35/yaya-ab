name: Bump commandes link cache

on:
  push:
    paths:
      - '.github/workflows/bump-commandes-link-cache.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Force protection de session Commande
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='yaya-ab-commandes-link.js?v=commandes-link-17'
          new='yaya-ab-commandes-link.js?v=commandes-link-18'
          guard='<script src="commandes-work-session-guard.js?v=workguard-1"><\\/script>'
          if old not in s:
              raise SystemExit('clé commandes-link-17 introuvable')
          s=s.replace(old,new,1)
          marker='<script src="yaya-ab-commandes-link.js?v=commandes-link-18"><\\/script>'
          if 'commandes-work-session-guard.js' not in s:
              s=s.replace(marker,guard+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "Yaya automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Force la protection Commande sans rerendu v18"
          git pull --rebase origin main
          git push origin main
