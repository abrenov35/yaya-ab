name: Force navigation-safe Commande cache

on:
  push:
    paths:
      - '.github/workflows/bump-commandes-link-cache.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attendre le bump de version Yaya
        run: sleep 10
      - name: Reprendre la racine la plus récente
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Forcer la liaison Commande navigation-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='yaya-ab-commandes-link.js?v=commandes-link-21'
          new='yaya-ab-commandes-link.js?v=commandes-link-22'
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          elif new not in s:
              raise SystemExit('clé commandes-link-21 introuvable')
          PY
      - name: Commit
        run: |
          git config user.name "Yaya automation"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "Cache navigation-safe déjà forcé"
            exit 0
          fi
          git add index.html
          git commit -m "Force la liaison Commande navigation-safe v22"
          git push origin main
