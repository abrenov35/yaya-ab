name: Force disabled auto refresh cache

on:
  push:
    paths:
      - '.github/workflows/bump-commandes-link-cache.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attendre le bump de version Yaya
        run: sleep 10
      - name: Reprendre la racine la plus récente
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Forcer les versions sans rafraichissement automatique
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements=[
              ('yaya-auto-refresh.js?v=autorefresh-10','yaya-auto-refresh.js?v=autorefresh-11'),
              ('yaya-external-return-refresh.js?v=externalreturn-5','yaya-external-return-refresh.js?v=externalreturn-6'),
          ]
          changed=False
          for old,new in replacements:
              if old in s:
                  s=s.replace(old,new,1)
                  changed=True
              elif new not in s:
                  raise SystemExit('clé introuvable: '+old)
          if changed:
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "Yaya automation"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "Versions déjà forcées"
            exit 0
          fi
          git add index.html
          git commit -m "Force Yaya sans synchro automatique en travail Commande"
          git push origin main
