name: Install finance delete fallback v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-finance-delete-fallback-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add fallback script to Yaya
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          lines = p.read_text(encoding="utf-8").splitlines()
          if not any("finance-delete-fallback-v1.js" in x for x in lines):
              for i, line in enumerate(lines):
                  if "finance-background-save-delete-v1.js" in line:
                      lines.insert(i + 1, "    '<script src=\"finance-delete-fallback-v1.js?v=1\"><\\/script>'+")
                      break
              else:
                  raise SystemExit("Finance script line not found")
              p.write_text("\n".join(lines) + "\n", encoding="utf-8")
      - name: Commit activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Activate purchase and charge deletion fallback"
          git push
