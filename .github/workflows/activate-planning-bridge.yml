name: Activate secure Planning bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-planning-bridge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Activate the single Planning bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path

          status = Path('chantier-planning-status-fix.js')
          status.write_text(r'''(function(){
  'use strict';

  // Désactive l'ancienne passerelle chargée plus tard par planning-toolbar-link.js.
  window.__yayaAutoPlanningCreateInstalled=true;

  if(document.querySelector('script[data-yaya-planning-bridge-v1]'))return;
  const script=document.createElement('script');
  script.src='planning-bridge.js?v=bridge-1';
  script.async=false;
  script.setAttribute('data-yaya-planning-bridge-v1','1');
  document.head.appendChild(script);
})();
''', encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = 'chantier-planning-status-fix.js?v=planningstatus-4'
          new = 'chantier-planning-status-fix.js?v=planningstatus-5'
          if old not in text and new not in text:
              raise SystemExit('Loader Planning status introuvable dans index.html')
          text = text.replace(old, new)
          index.write_text(text, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add chantier-planning-status-fix.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Sécurise la passerelle Yaya vers Planning"
          git pull --rebase origin main
          git push origin main
