name: Update Yaya API URL

on:
  push:
    paths:
      - '.github/workflows/update-yaya-api-url.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remplacer l'ancien Web App Yaya
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = 'https://script.google.com/macros/s/AKfycbx6IwMFf2plAq7i8qf8qF6f6MMC-1-WynAqn1ZRqCZrVqHeE9a1ygSSTzp5uOf0L3bn/exec'
          new = 'https://script.google.com/macros/s/AKfycbxXBpXjWXEF-7p6vvOE3blSBc8_5e62AtQb2stHjnrGE025cOxQGy-zAguYmN2u9O4K/exec'

          changed = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or '.github' in p.parts:
                  continue
              if p.suffix.lower() not in {'.html', '.js'}:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              if old in text:
                  p.write_text(text.replace(old, new), encoding='utf-8')
                  changed.append(str(p))

          print('Fichiers modifiés:', changed)
          if not changed:
              raise SystemExit('Ancienne URL API introuvable dans les fichiers actifs')
          PY

      - name: Publier la nouvelle URL API
        run: |
          git config user.name "Yaya automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Yaya - basculer vers le nouveau Web App"

          for i in 1 2 3 4 5; do
            git pull --rebase origin main || { sleep 2; continue; }
            if git push origin main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
