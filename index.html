/* YAYA V142 — PAGE ACHATS / CHARGES */

:root{
  --charge-navy:#162d49;
  --charge-muted:#64748b;
  --charge-border:#dfe5ec;
  --charge-row:#f8fafc;
  --charge-green:#16803d;
  --charge-red:#b91c1c;
}

.charges-toolbar{
  display:flex;
  align-items:center;
  margin:0 0 10px;
}
.charges-add-btn{
  min-height:38px;
  padding:0 18px;
  border-radius:8px;
  white-space:nowrap;
}

.controle-title{
  display:flex;
  align-items:center;
  gap:7px;
  margin:8px 0 6px;
  color:var(--charge-navy);
  font-size:13px;
  font-weight:900;
  text-transform:uppercase;
}
.controle-title>span{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:20px;
  height:20px;
  padding:0 5px;
  border-radius:999px;
  background:#fee2e2;
  color:var(--charge-red);
  font-size:10px;
  font-weight:900;
}

.section-title{
  margin:16px 0 6px;
  color:var(--charge-muted);
  font-size:10px;
  font-weight:800;
  letter-spacing:.09em;
  text-transform:uppercase;
}

.controle-card,.validees-card{
  border:1px solid var(--charge-border);
  border-radius:10px;
  background:#fff;
  overflow:hidden;
  box-shadow:0 1px 3px rgba(15,23,42,.06);
}
.controle-vide{
  padding:12px 14px;
  border:1px dashed var(--charge-border);
  border-radius:9px;
  color:var(--charge-muted);
  font-size:11px;
}

.controle-ligne,
.charge-validee-ligne{
  display:grid;
  grid-template-columns:64px 170px 170px minmax(180px,1fr) 100px 150px;
  column-gap:10px;
  align-items:center;
  min-height:42px;
  padding:5px 10px;
  border-bottom:1px solid #edf1f5;
}
.controle-ligne:last-child,
.charge-validee-ligne:last-child{border-bottom:0}
.controle-ligne:hover,
.charge-validee-ligne:hover{background:var(--charge-row)}

.badge,
.charge-fournisseur,
.charge-chantier{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:0;
  height:28px;
  padding:0 8px;
  border-radius:7px;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.badge.b-doc{
  background:#e5e7eb;
  color:#111827;
}
.charge-fournisseur{
  background:#ddd0f3;
  color:#6246a8;
}
.charge-chantier{
  background:#b9eadc;
  color:#006b5c;
}
.charge-designation{
  min-width:0;
  color:var(--charge-muted);
  font-size:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.charge-montant{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:28px;
  padding:0 10px;
  border:1px solid #d8dee6;
  border-radius:999px;
  background:#fff;
  color:var(--charge-navy);
  font-size:11px;
  font-weight:900;
  white-space:nowrap;
}

.controle-actions,
.charge-validee-actions{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:4px;
  min-width:0;
  white-space:nowrap;
}
.charge-open-btn,
.charge-edit-btn,
.charge-valid-btn,
.charge-dup-btn,
.charge-rejet-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:28px;
  height:28px;
  padding:0;
  border:1px solid #cfd6df;
  border-radius:6px;
  background:#fff;
  cursor:pointer;
  font-size:13px;
  line-height:1;
}
.charge-open-btn:hover{background:#fff7db}
.charge-edit-btn:hover{background:#e9f2ff}
.charge-valid-btn{
  color:var(--charge-green);
  border-color:#8fd2aa;
  font-weight:900;
}
.charge-valid-btn:hover{background:#e9f8ef}
.charge-dup-btn:hover{background:#f2ebff}
.charge-rejet-btn{
  color:var(--charge-red);
}
.charge-rejet-btn:hover{background:#feecec}

@media(max-width:1250px){
  .controle-ligne,
  .charge-validee-ligne{
    grid-template-columns:58px 140px 140px minmax(150px,1fr) 92px 142px;
    column-gap:7px;
    padding:5px 7px;
  }
}

@media(max-width:850px){
  .controle-ligne,
  .charge-validee-ligne{
    grid-template-columns:54px minmax(0,1fr) 90px;
    grid-template-areas:
      "type fournisseur montant"
      "chantier designation actions";
    row-gap:5px;
    min-height:72px;
  }
  .controle-ligne>.badge,
  .charge-validee-ligne>.badge{grid-area:type}
  .charge-fournisseur{grid-area:fournisseur}
  .charge-chantier{grid-area:chantier}
  .charge-designation{grid-area:designation}
  .charge-montant{grid-area:montant}
  .controle-actions,
  .charge-validee-actions{grid-area:actions}
  .charge-fournisseur,
  .charge-chantier{
    justify-content:flex-start;
    padding:0 7px;
  }
}

.piece-modal{
  width:min(94vw,980px)!important;
  height:min(88vh,760px)!important;
  max-width:980px!important;
}
.piece-modal h5{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.piece-frame{
  width:100%;
  height:calc(100% - 46px);
  border:0;
  border-radius:8px;
  background:#f8fafc;
}
