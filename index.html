(async()=>{try{

  const mobileCss=`
/* V161 — CHARGES iPhone : 2 lignes stables, aucune colonne ne déborde */
@media(max-width:760px){
  #pane-achats{overflow-x:hidden!important;width:100%!important;max-width:100%!important}

  #pane-achats .controle-ligne,

    display:grid!important;

    grid-template-areas:
      "type fournisseur montant"
      "chantier designation actions"!important;

    align-items:center!important;
  }

  #pane-achats .charge-validee-ligne>.badge{
    grid-area:type!important;
    width:76px!important;min-width:76px!important;max-width:76px!important;
    height:34px!important;padding:0 6px!important;justify-content:center!important;
  }
  #pane-achats .charge-fournisseur{grid-area:fournisseur!important;min-width:0!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important;font-size:13px!important}

  #pane-achats .charge-validee-actions{
    grid-area:actions!important;

  }
  #pane-achats .charge-open-btn,
  #pane-achats .charge-edit-btn,
  #pane-achats .charge-valid-btn,

  #pane-achats .charge-rejet-btn{
    flex:0 0 28px!important;width:28px!important;min-width:28px!important;max-width:28px!important;height:28px!important;padding:0!important;margin:0!important
  }

@media(max-width:390px){
  #pane-achats .controle-ligne,
  #pane-achats .charge-validee-ligne{grid-template-columns:74px minmax(0,1fr) auto!important;gap:6px 7px!important;padding:9px 7px!important}
  #pane-achats .controle-ligne>.badge,
  #pane-achats .charge-validee-ligne>.badge{width:68px!important;min-width:68px!important;max-width:68px!important;font-size:9px!important}

  #pane-achats .charge-open-btn,

`;
  html=html.replace('</head>','<style>'+mobileCss+'</style></head>');
  const fix=`
window.voirPiece=function(u){
  u=String(u||'').trim();if(!u)return;
  const root=document.getElementById('modalRoot');if(!root)return;
  const oldFrame=root.querySelector('iframe.piece-frame');
  if(oldFrame){try{oldFrame.src='about:blank'}catch(e){};try{oldFrame.remove()}catch(e){}}
  root.innerHTML='';
  let src=u;
  const low=u.toLowerCase();
  const driveMarker='drive.google.com/file/d/';
  const drivePos=low.indexOf(driveMarker);
  if(drivePos>=0){const id=u.slice(drivePos+driveMarker.length).split('/')[0].split('?')[0].split('#')[0];src='https://drive.google.com/file/d/'+id+'/preview';}
  else if(low.includes('dropbox.com')){
    try{const d=new URL(u);d.searchParams.delete('dl');d.searchParams.set('raw','1');src=d.toString();}
    catch(e){const p=u.split('?');const q=(p[1]||'').split('&').filter(x=>x&&x.slice(0,3)!=='dl='&&x.slice(0,4)!=='raw=').concat('raw=1');src=p[0]+'?'+q.join('&');}
  }
  root.innerHTML='<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal piece-modal"><h5><span>Pièce jointe</span><button type="button" onclick="closeModal()">Fermer</button></h5><iframe class="piece-frame" src="'+esc(src)+'" title="Pièce jointe" loading="lazy" referrerpolicy="no-referrer"></iframe></div></div>';
};
const _yayaCloseModal=window.closeModal;
window.closeModal=function(){
  const root=document.getElementById('modalRoot');
  if(root){const f=root.querySelector('iframe.piece-frame');if(f){try{f.src='about:blank'}catch(e){};try{f.remove()}catch(e){}}}
  if(typeof _yayaCloseModal==='function')return _yayaCloseModal.apply(this,arguments);
  if(root)root.innerHTML='';
};
`;
  html=html.replace('const _render=window.render;',fix+'const _render=window.render;');
  document.open();document.write(html);document.close();
}catch(e){document.getElementById('boot').textContent='Erreur de chargement : '+e.message}})();
