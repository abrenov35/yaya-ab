<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Yaya — AB RENOV 35</title>
</head>
<body>
<div id="boot" style="font-family:system-ui;padding:30px;text-align:center;color:#162D49">Chargement de Yaya…</div>
<script>
(async()=>{
  try{
    const base='https://raw.githubusercontent.com/abrenov35/yaya-ab/362bf7657744a0bf32e449940ed6066402fb4afc/index.html';
    let html=await (await fetch(base,{cache:'no-store'})).text();
    const css=`
/* ===== MODALES YAYA — finition pro ===== */
.overlay{
  align-items:center !important;
  justify-content:center !important;
  padding:24px !important;
  background:rgba(13,32,54,.58) !important;
  backdrop-filter:blur(3px);
}
.modal{
  width:min(620px,calc(100vw - 32px)) !important;
  max-width:620px !important;
  max-height:calc(100vh - 48px) !important;
  overflow-y:auto !important;
  background:#fff !important;
  border-radius:18px !important;
  padding:22px !important;
  border:1px solid rgba(22,45,73,.10) !important;
  box-shadow:0 24px 70px rgba(13,32,54,.30) !important;
}
.modal h5{
  margin:0 0 18px !important;
  padding-bottom:13px !important;
  min-height:38px;
  display:flex !important;
  align-items:center !important;
  justify-content:space-between !important;
  gap:16px;
  border-bottom:1px solid rgba(22,45,73,.10);
  color:#162D49 !important;
  font-size:16px !important;
  font-weight:750 !important;
}
.modal h5 button{
  flex:0 0 auto;
  min-height:34px;
  padding:6px 14px !important;
  border:1px solid rgba(22,45,73,.16) !important;
  border-radius:9px !important;
  background:#fff !important;
  color:#536273 !important;
  font-size:12px !important;
  font-weight:650 !important;
}
.modal .row{
  display:flex !important;
  gap:10px !important;
  align-items:center !important;
  margin-bottom:12px !important;
}
.modal .mrow{
  display:flex !important;
  gap:10px !important;
  align-items:center !important;
  margin-top:10px !important;
}
.modal label{
  flex:0 0 115px;
  color:#536273 !important;
  font-size:11.5px !important;
  font-weight:700 !important;
  line-height:1.3;
}
.modal .inp,
.modal .msel,
.modal .mnum{
  min-height:40px !important;
  border:1px solid rgba(22,45,73,.22) !important;
  border-radius:9px !important;
  background:#fff !important;
  color:#162D49 !important;
  padding:9px 11px !important;
  outline:none !important;
  transition:border-color .15s ease,box-shadow .15s ease;
}
.modal .inp:focus,
.modal .msel:focus,
.modal .mnum:focus{
  border-color:#C9A227 !important;
  box-shadow:0 0 0 3px rgba(201,162,39,.14) !important;
}
.modal .btnp,
.modal .btn2,
.modal .btn-valid{
  min-height:38px !important;
  border-radius:9px !important;
  font-weight:650 !important;
}
.modal .btnp.go{
  background:#2E7D46 !important;
  box-shadow:0 2px 8px rgba(46,125,70,.18);
}
.modal .note{
  line-height:1.45 !important;
}
.modal .dash{
  width:100%;
  padding:9px 12px !important;
  border-radius:9px !important;
}
.modal .mfoot{
  padding-top:12px !important;
  margin-top:16px !important;
  border-top:1px solid rgba(22,45,73,.08);
  display:flex !important;
  gap:10px !important;
}
@media(max-width:640px){
  .overlay{align-items:flex-start !important;padding:12px !important;}
  .modal{width:100% !important;max-width:none !important;max-height:calc(100vh - 24px) !important;padding:16px !important;border-radius:14px !important;}
  .modal .row,.modal .mrow{align-items:stretch !important;}
  .modal label{flex:0 0 100%;margin-bottom:-4px !important;}
  .modal .inp,.modal .msel,.modal .mnum{min-height:42px !important;flex:1 1 100% !important;width:100% !important;}
  .modal .mfoot{flex-wrap:wrap;}
}
`;
    html=html.replace('</style>',css+'\n</style>');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('boot').innerHTML='<b>Chargement impossible</b><br><small>'+String(e.message||e)+'</small>';
  }
})();
</script>
</body>
</html>
