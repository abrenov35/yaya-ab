<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"><title>Yaya — AB RENOV 35</title></head>
<body><div id="boot" style="font-family:system-ui;padding:30px;text-align:center;color:#162D49">Chargement de Yaya…</div>
<script>
(async()=>{try{
  const base='https://raw.githubusercontent.com/abrenov35/yaya-ab/cf25c0a122a2de1a4629d8945c21c228eca72006/index.html';
  let html=await (await fetch(base,{cache:'no-store'})).text();
  html=html.replace("const YAYA_VERSION='V165';","const YAYA_VERSION='V166';");
  const css=`
/* V166 — vraies cartes mobiles pour Charges + Documents, CSS uniquement */
@media(max-width:760px){
  /* ===== CHARGES ===== */
  #pane-achats .controle-card,
  #pane-achats .validees-card{
    overflow:visible!important;
    width:100%!important;
    max-width:100%!important;
  }
  #pane-achats .controle-ligne,
  #pane-achats .charge-validee-ligne{
    display:grid!important;
    grid-template-columns:72px minmax(0,1fr) auto!important;
    grid-template-areas:
      "type fournisseur montant"
      "chantier designation designation"
      "actions actions actions"!important;
    gap:7px 8px!important;
    width:100%!important;
    max-width:100%!important;
    min-width:0!important;
    min-height:0!important;
    height:auto!important;
    padding:10px 8px!important;
    box-sizing:border-box!important;
    align-items:center!important;
    overflow:hidden!important;
  }
  #pane-achats .controle-ligne>.badge,
  #pane-achats .charge-validee-ligne>.badge{
    grid-area:type!important;
    width:68px!important;min-width:68px!important;max-width:68px!important;
    height:30px!important;min-height:30px!important;
    justify-content:center!important;padding:0 4px!important;font-size:9px!important;
  }
  #pane-achats .charge-fournisseur{
    grid-area:fournisseur!important;
    min-width:0!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important;
    font-size:12px!important;font-weight:800!important;
  }
  #pane-achats .charge-montant{
    grid-area:montant!important;justify-self:end!important;
    white-space:nowrap!important;font-size:12px!important;
  }
  #pane-achats .charge-chantier{
    grid-area:chantier!important;
    min-width:0!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important;
    font-size:11px!important;color:#43556a!important;
  }
  #pane-achats .charge-designation{
    grid-area:designation!important;
    min-width:0!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important;
    font-size:11px!important;color:#7a8796!important;
  }
  #pane-achats .controle-actions,
  #pane-achats .charge-validee-actions{
    grid-area:actions!important;
    display:flex!important;align-items:center!important;justify-content:flex-end!important;
    width:100%!important;max-width:none!important;min-width:0!important;
    gap:5px!important;overflow:visible!important;padding-top:1px!important;
  }
  #pane-achats .charge-open-btn,
  #pane-achats .charge-edit-btn,
  #pane-achats .charge-valid-btn,
  #pane-achats .charge-dup-btn,

  }

  /* ===== DOCUMENTS ===== */

  #pane-docs .card{
    width:100%!important;max-width:100%!important;overflow:visible!important;padding:0!important;

  #pane-documents .doc-row-standard,

  #pane-docs .doc-row-standard{

      "type source date"
      "chantier designation designation"
      "actions actions actions"!important;
    gap:7px 8px!important;
    width:100%!important;max-width:100%!important;min-width:0!important;
    min-height:0!important;height:auto!important;
    padding:10px 8px!important;margin:0!important;box-sizing:border-box!important;
    align-items:center!important;overflow:hidden!important;
  }
  #pane-documents .docligne>*,#pane-documents .doc-row-standard>*,
  #pane-docs .docligne>*,#pane-docs .doc-row-standard>*{
    min-width:0!important;min-height:0!important;height:auto!important;margin:0!important;
  }
  #pane-documents .docligne>*:nth-child(1),#pane-documents .doc-row-standard>*:nth-child(1),
  #pane-docs .docligne>*:nth-child(1),#pane-docs .doc-row-standard>*:nth-child(1){grid-area:type!important}

  #pane-docs .docligne>*:nth-child(2),#pane-docs .doc-row-standard>*:nth-child(2){grid-area:source!important;font-size:12px!important;font-weight:800!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important}

  #pane-documents .docligne>*:nth-child(4),#pane-documents .doc-row-standard>*:nth-child(4),
  #pane-docs .docligne>*:nth-child(4),#pane-docs .doc-row-standard>*:nth-child(4){grid-area:designation!important;font-size:11px!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important;color:#7a8796!important}
  #pane-documents .docligne>*:nth-child(5),#pane-documents .doc-row-standard>*:nth-child(5),
  #pane-docs .docligne>*:nth-child(5),#pane-docs .doc-row-standard>*:nth-child(5){grid-area:date!important;justify-self:end!important;white-space:nowrap!important;font-size:10px!important;color:#98a1ab!important}
  #pane-documents .docligne>*:nth-child(6),#pane-documents .doc-row-standard>*:nth-child(6),
  #pane-docs .docligne>*:nth-child(6),#pane-docs .doc-row-standard>*:nth-child(6){grid-area:actions!important;width:100%!important;justify-self:stretch!important}
  #pane-documents .badge.b-mail,#pane-documents .badge.b-doc,
  #pane-docs .badge.b-mail,#pane-docs .badge.b-doc{
    width:68px!important;min-width:68px!important;max-width:68px!important;
    height:30px!important;min-height:30px!important;padding:0 4px!important;font-size:8px!important;
  }
  #pane-documents .doc-actions,#pane-docs .doc-actions{
    display:flex!important;align-items:center!important;justify-content:flex-end!important;
    width:100%!important;gap:5px!important;min-height:0!important;height:auto!important;padding-top:1px!important;
  }
  #pane-documents .doc-view-btn,#pane-documents .doc-edit-btn,
  #pane-docs .doc-view-btn,#pane-docs .doc-edit-btn{
    width:30px!important;min-width:30px!important;max-width:30px!important;height:30px!important;min-height:30px!important;padding:0!important;margin:0!important;
  }
}

@media(max-width:390px){
  #pane-achats .controle-ligne,#pane-achats .charge-validee-ligne,
  #pane-documents .docligne,#pane-documents .doc-row-standard,
  #pane-docs .docligne,#pane-docs .doc-row-standard{
    grid-template-columns:64px minmax(0,1fr) auto!important;
    gap:6px!important;padding:9px 6px!important;
  }
  #pane-achats .controle-ligne>.badge,#pane-achats .charge-validee-ligne>.badge,
  #pane-documents .badge.b-mail,#pane-documents .badge.b-doc,
  #pane-docs .badge.b-mail,#pane-docs .badge.b-doc{
    width:60px!important;min-width:60px!important;max-width:60px!important;font-size:7.5px!important;
  }
}
`;
  html=html.replace('</head>','<style>'+css+'</style></head>');
  document.open();document.write(html);document.close();
}catch(e){document.getElementById('boot').textContent='Erreur de chargement : '+e.message}})();
</script></body></html>
