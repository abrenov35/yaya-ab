<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"><title>Yaya — AB RENOV 35</title></head>
<body><div id="boot" style="font-family:system-ui;padding:30px;text-align:center;color:#162D49">Chargement de Yaya…</div>
<script>
(async()=>{try{
const src='https://raw.githubusercontent.com/abrenov35/yaya-ab/65471f76025e8576d3e4a986b4f328d0e0ea1986/index.html';
let html=await (await fetch(src,{cache:'no-store'})).text();
html=html.replace("const YAYA_VERSION='V109';","const YAYA_VERSION='V110';");
const forced=`
/* V110 - TYPOGRAPHIE HOMOGENE SUR TOUT YAYA */
#pane-chantiers,#pane-achats,#pane-documents,#pane-heures,#pane-equipe{font-size:12px!important}
#pane-chantiers :where(div,span,p,a,b,strong,li),
#pane-achats :where(div,span,p,a,b,strong,li),
#pane-documents :where(div,span,p,a,b,strong,li),
#pane-heures :where(div,span,p,a,b,strong,li),
#pane-equipe :where(div,span,p,a,b,strong,li){font-size:12px!important;line-height:1.25!important}
#pane-chantiers :where(h1),#pane-achats :where(h1),#pane-documents :where(h1),#pane-heures :where(h1),#pane-equipe :where(h1){font-size:20px!important;font-weight:800!important}
#pane-chantiers :where(h2,h3,h4,h5,.section-title),#pane-achats :where(h2,h3,h4,h5,.section-title),#pane-documents :where(h2,h3,h4,h5,.section-title),#pane-heures :where(h2,h3,h4,h5,.section-title),#pane-equipe :where(h2,h3,h4,h5,.section-title){font-size:15px!important;font-weight:700!important}
#pane-chantiers :where(button,.btn,.btnp,.btn2),#pane-achats :where(button,.btn,.btnp,.btn2),#pane-documents :where(button,.btn,.btnp,.btn2),#pane-heures :where(button,.btn,.btnp,.btn2),#pane-equipe :where(button,.btn,.btnp,.btn2){font-size:11px!important;font-weight:700!important}
#pane-chantiers :where(input,select,textarea),#pane-achats :where(input,select,textarea),#pane-documents :where(input,select,textarea),#pane-heures :where(input,select,textarea),#pane-equipe :where(input,select,textarea){font-size:12px!important}
#pane-chantiers table,#pane-achats table,#pane-documents table,#pane-heures table,#pane-equipe table{font-size:11px!important}
#pane-chantiers th,#pane-achats th,#pane-documents th,#pane-heures th,#pane-equipe th{font-size:10px!important;font-weight:700!important}
#pane-chantiers td,#pane-achats td,#pane-documents td,#pane-heures td,#pane-equipe td{font-size:11px!important}
#pane-chantiers :where(.badge,.pill,.tag,.status),#pane-achats :where(.badge,.pill,.tag,.status),#pane-documents :where(.badge,.pill,.tag,.status),#pane-heures :where(.badge,.pill,.tag,.status),#pane-equipe :where(.badge,.pill,.tag,.status){font-size:9px!important;font-weight:700!important}
/* Les noms/titres de cartes restent lisibles mais ne dominent plus l'écran */
#pane-chantiers :where(.card b,.card strong,.row b,.row strong),#pane-documents :where(.card b,.card strong),#pane-equipe :where(.card b,.card strong){font-size:12px!important}
/* KPI uniquement lorsqu'une classe KPI explicite existe */
#pane-chantiers :where(.kpi,.stat-value),#pane-achats :where(.kpi,.stat-value),#pane-documents :where(.kpi,.stat-value),#pane-heures :where(.kpi,.stat-value),#pane-equipe :where(.kpi,.stat-value){font-size:20px!important;font-weight:800!important}
`;
html=html.replace('</style>',forced+'</style>');
document.open();document.write(html);document.close();
}catch(e){document.getElementById('boot').textContent='Erreur de chargement : '+e.message}})();
</script></body></html>
