<script>
(async()=>{

  let base=await fetch(

  });


  const sourceLoader=
    "  const source=await fetch('index-legacy.html?v=marcheht-6',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('legacy '+r.status);return r.text();});";


  const apiGetPatch=`async function apiGet(forceNetwork){
  const CACHE_DATA_KEY='YAYA_CACHE_DATA_V2';
  const CACHE_META_KEY='YAYA_CACHE_META_V2';

  if(!forceNetwork){
    try{
      const raw=localStorage.getItem(CACHE_DATA_KEY);
      const rawMeta=localStorage.getItem(CACHE_META_KEY);

      if(raw&&rawMeta){
        const cached=JSON.parse(raw);
        const cachedMeta=JSON.parse(rawMeta);

        const required=[
          'chantiers',
          'salaries',
          'heures',
          'achats',
          'avenants',
          'documents',
          'validations'
        ];

        const valide=
          cached &&
          typeof cached==='object' &&
          cachedMeta &&
          cachedMeta.tabs &&
          required.every(k=>Array.isArray(cached[k]));

        if(valide){
          if(!Array.isArray(cached.commandes)){
            cached.commandes=[];
          }

          window.__yayaCachedBoot=true;
          window.__yayaCachedMeta=cachedMeta;

          return cached;
        }
      }
    }catch(e){}
  }


  if(window.__yayaApiGetPromise){
    return window.__yayaApiGetPromise;
  }


  window.__yayaApiGetPromise=(async function(){

    let lastErr=null;

    const timeouts=[
      12000,
      16000,
      20000
    ];


    for(
      let tentative=1;
      tentative<=3;
      tentative++
    ){

      try{

        const sep=
          API.includes('?')
            ?'&'
            :'?';

        const url=
          API+
          sep+
          '_yaya='+
          Date.now()+
          '_'+
          tentative+
          (forceNetwork?'&_yaya_force=1':'');


        const ctrl=
          new AbortController();

        const timer=
          setTimeout(
            ()=>ctrl.abort(),
            timeouts[tentative-1]
          );

        let r;

        try{

          r=await fetch(
            url,
            {
              method:'GET',
              cache:'no-store',
              signal:ctrl.signal
            }
          );

        }finally{

          clearTimeout(timer);

        }


        const txt=
          await r.text();

        let j;


        try{

          j=JSON.parse(txt);

        }catch(parseErr){

          if(/^\s*</.test(txt)){
            throw new Error(
              'Réponse Google temporairement invalide'
            );
          }

          throw parseErr;

        }


        if(!j.ok){
          throw new Error(
            j.error||
            'réponse invalide'
          );
        }


        if(
          j.data &&
          typeof j.data==='object'
        ){

          try{

            localStorage.setItem(
              CACHE_DATA_KEY,
              JSON.stringify(j.data)
            );

            if(
              j.meta &&
              j.meta.tabs
            ){

              localStorage.setItem(
                CACHE_META_KEY,
                JSON.stringify(j.meta)
              );

            }

          }catch(e){}


          window.__yayaCachedBoot=false;

          window.__yayaCachedMeta=
            (
              j.meta &&
              j.meta.tabs
            )
              ?j.meta
              :null;
        }


        return j.data;


      }catch(e){

        lastErr=e;

        if(tentative<3){

          await new Promise(
            res=>setTimeout(
              res,
              500*tentative
            )
          );

        }
      }
    }


    throw lastErr||
      new Error(
        'API Yaya indisponible'
      );

  })();


  try{

    return await window.__yayaApiGetPromise;

  }finally{

    window.__yayaApiGetPromise=null;

  }

}`;


  const sourceRetry=`  let source=await fetch('index-legacy.html?v=cacheboot-1',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('legacy '+r.status);return r.text();});
  source=source.replace(/async function apiGet\\(\\)\\{[\\s\\S]*?\\n\\}/,${JSON.stringify(apiGetPatch)});
  source=source.replaceAll('x=>x.id===id','x=>String(x.id)===String(id)');
  source=source.replace('    await synchroniserDatesPlanning();\\n    syncMsg("✓ connecté");\\n    render();','    syncMsg("✓ connecté");\\n    render();\\n    ');`;

  if(!base.includes(sourceLoader)){
    throw new Error(
      'Point insertion retry API introuvable'
    );
  }


  base=
    base.replace(
      sourceLoader,
      sourceRetry

    '<script src="chantier-toolbar-style.js?v=toolbar-5"><\\/script>'+
    '<script src="evolution-ca-2026-patch.js?v=evo2026-3"><\\/script>'+
    '<script src="charges-page-cleanup.js?v=charges-2"><\\/script>'+
    '<script src="chantier-actions-line.js?v=actions-13"><\\/script>'+
    '<script src="avoir-display-positive.js?v=avoir-1"><\\/script>'+
    '<script src="chantier-create-search-line.js?v=mainline-18"><\\/script>'+
    '<script src="recent-items-limit.js?v=recent-10-1"><\\/script>'+
    '<script src="documents-page-compact-fix.js?v=doccompact-13"><\\/script>'+
    '<script src="chantier-mode-suivi-patch.js?v=mode-2"><\\/script>'+
    '<script src="chantier-view-navigation-fix.js?v=viewnav-2"><\\/script>'+
    '<script src="chantier-planning-status-fix.js?v=planningstatus-8"><\\/script>'+
    '<script src="chantier-tabs-order.js?v=order-3"><\\/script>'+
    '<script src="chantier-save-close-patch.js?v=saveclose-2"><\\/script>'+
    '<script src="chantier-search-focus-fix.js?v=searchfix-1"><\\/script>'+
    '<script src="fiche-inter-same-tab.js?v=inline-3"><\\/script>'+
    '<script src="planning-toolbar-link.js?v=planning-link-6"><\\/script>'+
    '<script src="yaya-auto-refresh.js?v=autorefresh-8"><\\/script>'+
    '<script src="yaya-force-fresh-chantiers.js?v=fresh-2"><\\/script>'+
    '<script src="delete-confirm-preserve-files.js?v=deletepreserve-1"><\\/script>'+
    '<script src="document-save-lock.js?v=doclock-1"><\\/script>'+
    '<script src="chantier-detail-section-tabs-mail-wrapper.js?v=detailtabs-native-commandes-3"><\\/script>'+
    '<script src="commande-actions.js?v=commande-actions-native-2"><\\/script>'+
    '<script src="chantier-detail-visual-polish.js?v=detailvisual-5"><\\/script>'+
    '<script src="colored-view-eyes.js?v=eyes-1"><\\/script>'+

    '<script src="chantier-tabs-soft-theme.js?v=softtabs-10"><\\/script>'+
    '<script src="margin-badge-colors.js?v=margincolors-2"><\\/script>'+

    '<script src="chantier-signed-quotes-display.js?v=signedquotes-2"><\\/script>'+
    '<script src="layout-centering-fix.js?v=layout-7"><\\/script>'+
    '<script src="finance-edit-actions-fix.js?v=financeeditactions-1"><\\/script>'+
    '<script src="documents-tab-no-count.js?v=nocount-4"><\\/script>'+
    '<script src="doc-row-date-first-fix.js?v=datefirst-5"><\\/script>'+
    '<script src="action-button-1-style.js?v=btn1-20"><\\/script>'+
    '<script src="onedrive-timeout-diagnostic.js?v=onedrive-timeout-2"><\\/script>'+
    '<script src="onedrive-external-open.js?v=onedrive-binary-preview-12"><\\/script>'+
    '<script src="mail-chantier-section-fix.js?v=mailstable-14"><\\/script>'+
    '<script src="mail-edit-sync-fix.js?v=maileditsync-5"><\\/script>'+
    '<script src="mails-page-last10.js?v=mailslast10-7"><\\/script>'+
    '<script src="sous-traitant-page.js?v=stpage-5"><\\/script>'+
    '<script src="heures-toolbar-move.js?v=hours-toolbar-10"><\\/script>'+
    '<script src="mobile-stability-fix.js?v=mobile-keyboard-8"><\\/script>'+
    '<script src="market-view-link-fix.js?v=marketview-3"><\\/script>'+
    '<script src="market-initial-quote-actions.js?v=marketinitial-3"><\\/script>'+
    '<script src="devis-delete-confirm.js?v=devisconfirm-1"><\\/script>'+
    '<script src="devis-no-ai-upload.js?v=noai-fast-8"><\\/script>'+
    '<script src="devis-document-link-fix.js?v=linkfix-9"><\\/script>'+
    "</body>'";


  if(!base.includes(marker)){
    throw new Error(
      'Point insertion aperçu introuvable'
    );
  }


  base=
    base.replace(
      marker,
      replacement
    );


  document.open();
  document.write(base);
  document.close();


})().catch(e=>{

  document.body.innerHTML=
    '<pre style="padding:20px;color:#b42318">'+
    'Erreur chargement Yaya : '+
    String(e)+
    '</pre>';

});
