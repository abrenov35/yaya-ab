/* YAYA V145 — CHARGES : STYLE SOBRE / PRO */

function alignChantierTools(){const pane=document.getElementById('pane-chantiers');if(!pane)return;const search=pane.querySelector('input[placeholder*="Rechercher un chantier"]');if(!search)return;const createBtn=[...pane.querySelectorAll('button')].find(b=>(b.textContent||'').includes('Créer un chantier'));if(!createBtn||createBtn.closest('.yaya-chantier-tools'))return;const searchWrap=search.parentElement;const tools=document.createElement('div');tools.className='yaya-chantier-tools';createBtn.parentNode.insertBefore(tools,createBtn);tools.appendChild(createBtn);const sw=document.createElement('div');sw.className='yaya-search-wrap';while(searchWrap.firstChild)sw.appendChild(searchWrap.firstChild);searchWrap.parentNode.insertBefore(sw,searchWrap);searchWrap.remove();tools.appendChild(sw);}
function iconiserActionsCharges(){document.querySelectorAll('.charge-open-btn,.charge-edit-btn,.charge-valid-btn,.charge-dup-btn,.charge-rejet-btn').forEach(b=>{if(b.classList.contains('charge-action-icon'))return;let ico='',label='';if(b.classList.contains('charge-open-btn')){ico='👁';label='Voir la pièce';}else if(b.classList.contains('charge-edit-btn')){ico='✏️';label='Modifier';}else if(b.classList.contains('charge-valid-btn')){ico='✓';label='Valider';}else if(b.classList.contains('charge-dup-btn')){ico='⧉';label='Classer comme doublon';}else if(b.classList.contains('charge-rejet-btn')){ico='✕';label='Rejeter';}if(ico){b.textContent=ico;b.title=label;b.setAttribute('aria-label',label);b.classList.add('charge-action-icon');}});}


/* V150 document edit helper */
function modifierDocumentDepuisLigne(btn){
  const row=btn.closest('.doc-row-standard,.docligne');
  if(!row)return;
  const existing=[...row.querySelectorAll('button,[onclick]')].find(el=>{
    if(el===btn)return false;
    const oc=el.getAttribute&&el.getAttribute('onclick')||'';
    return /editDoc|editDocument|openDocModal|openDocumentModal/i.test(oc);
  });
  if(existing){ existing.click(); return; }

  const id=row.dataset.id||row.getAttribute('data-id')||'';
  if(id){
    if(typeof window.editDocument==='function'){window.editDocument(id);return;}
    if(typeof window.editDoc==='function'){window.editDoc(id);return;}
  }
  if(typeof window.openDocModal==='function'){window.openDocModal(id||undefined);return;}
  if(typeof window.openDocumentModal==='function'){window.openDocumentModal(id||undefined);return;}
  if(typeof window.openDocument==='function'){window.openDocument(id||undefined);return;}
  toast("Modification indisponible pour ce document",true);
}

function styliserDocuments(){
  const panes=[document.getElementById('pane-docs'),document.getElementById('pane-documents')].filter(Boolean);
  panes.forEach(pane=>{
    const add=[...pane.querySelectorAll('button')].find(b=>(b.textContent||'').includes('Ajouter un document'));
    if(add){
      add.classList.add('docs-add-btn');
      if(!add.parentElement.classList.contains('docs-toolbar')) add.parentElement.classList.add('docs-toolbar');
    }

    [...pane.querySelectorAll('.card > div')].forEach(row=>{
      const txt=(row.textContent||'').trim();
      if(!txt || !/MAIL|DOCUMENT/i.test(txt)) return;
      row.classList.add('doc-row-standard');

      const buttons=[...row.querySelectorAll('button')];
      let viewBtn=buttons.find(b=>/VOIR/i.test((b.textContent||'').trim()));
      if(viewBtn){
        viewBtn.textContent='◉';
        viewBtn.title='Voir';
        viewBtn.setAttribute('aria-label','Voir');
        viewBtn.classList.add('doc-view-btn');
      }

      let actions = row.querySelector('.doc-actions');
      if(!actions){
        const last = row.lastElementChild;
        if(last && last !== viewBtn && (last.tagName==='SPAN' || last.tagName==='DIV')){
          actions = last;
          actions.classList.add('doc-actions');
        }else{
          actions=document.createElement('span');
          actions.className='doc-actions';
          if(viewBtn) row.insertBefore(actions, viewBtn);
          else row.appendChild(actions);
        }
      }
      if(viewBtn && viewBtn.parentElement!==actions) actions.appendChild(viewBtn);

      if(!actions.querySelector('.doc-edit-btn')){
        const editBtn=document.createElement('button');
        editBtn.type='button';
        editBtn.className='doc-edit-btn';
        editBtn.textContent='✎';
        editBtn.title='Modifier';
        editBtn.setAttribute('aria-label','Modifier');

        const directEdit=buttons.find(b=>/MODIFIER|EDIT/i.test((b.textContent||'').trim()) && b!==viewBtn);
        if(directEdit){
          editBtn.onclick=()=>directEdit.click();
          directEdit.style.display='none';
        }else{
          editBtn.onclick=()=>modifierDocumentDepuisLigne(editBtn);
        }
        actions.appendChild(editBtn);
      }
    });
  });
}
function applyPatches(){alignChantierTools();iconiserActionsCharges();styliserDocuments();document.querySelectorAll('.stat small').forEach(el=>{const t=(el.textContent||'').toLowerCase();if(t.includes('main-d')&&(t.includes('oeuvre')||t.includes('œuvre')))el.textContent='CHARGES';});document.querySelectorAll('.modal').forEach(m=>{const h=m.querySelector('h5');if(!(h&&/^Modifier l[’']achat/i.test((h.textContent||'').trim())))return;m.classList.add('achat-edit-modal');m.querySelectorAll('#pj-zone button,.mfoot button').forEach(b=>{const t=(b.textContent||'').trim().toUpperCase();let ico='',label='',extra='';if(t.includes('VOIR')){ico='👁';label='Voir la pièce';}else if(t.includes('REMPLACER')){ico='🔄';label='Remplacer la pièce';}else if(t.includes('ENREGISTRER')){ico='✓';label='Enregistrer';extra=' achat-icon-save';}else if(t.includes('ANNULER')){ico='✕';label='Annuler';extra=' achat-icon-cancel';}if(ico){b.textContent=ico;b.title=label;b.setAttribute('aria-label',label);b.className+=' achat-icon-btn'+extra;}});});}
window.voirPiece=function(u){
  u=String(u||'').trim();if(!u)return;
  let src=u;
  const driveMarker='drive.google.com/file/d/';
  const drivePos=u.toLowerCase().indexOf(driveMarker);
  if(drivePos>=0){const id=u.slice(drivePos+driveMarker.length).split('/')[0].split('?')[0].split('#')[0];src='https://drive.google.com/file/d/'+id+'/preview';}
  else if(u.toLowerCase().includes('dropbox.com')){
    try{const d=new URL(u);d.searchParams.delete('dl');d.searchParams.set('raw','1');src=d.toString();}
    catch(e){const p=u.split('?');const q=(p[1]||'').split('&').filter(x=>x&&x.slice(0,3)!=='dl='&&x.slice(0,4)!=='raw=').concat('raw=1');src=p[0]+'?'+q.join('&');}
  }
  const root=document.getElementById('modalRoot');if(!root)return;
  root.innerHTML='<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal piece-modal"><h5><span>Pièce jointe</span><button type="button" onclick="closeModal()">Fermer</button></h5><iframe class="piece-frame" src="'+esc(src)+'" title="Pièce jointe" loading="eager" allowfullscreen></iframe></div></div>';
};
const _render=window.render;if(typeof _render==='function')window.render=function(){const r=_render.apply(this,arguments);setTimeout(applyPatches,0);return r};new MutationObserver(()=>applyPatches()).observe(document.documentElement,{childList:true,subtree:true});setTimeout(applyPatches,100);
<\/script></body>`);

document.open();document.write(html);document.close();
}catch(e){document.getElementById('boot').textContent='Erreur de chargement : '+e.message}})();
</script></body></html>
