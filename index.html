<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"><title>Yaya — AB RENOV 35</title></head>
<body><div id="boot" style="font-family:system-ui;padding:30px;text-align:center;color:#162D49">Chargement de Yaya…</div>
<script>
(async()=>{try{
const YAYA_VERSION='V107';
const base='https://raw.githubusercontent.com/abrenov35/yaya-ab/362bf7657744a0bf32e449940ed6066402fb4afc/index.html';
let html=await (await fetch(base,{cache:'no-store'})).text();
html=html.replace(/<meta name="viewport"[^>]*>/i,'<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">');
html=html.replace('<div id="loader" style="display: none;">','<div id="loader" style="display: flex;">');
html=html.replace('expChantiers.clear(); expChantiers.add(nid);','expChantiers.clear();');
html=html.replace(/MAIN-D\\?['’]OEUVRE/g,'CHARGES').replace(/Main-d\\?['’]oeuvre/g,'Charges').replace(/MAIN-D\\?['’]ŒUVRE/g,'CHARGES').replace(/Main-d\\?['’]œuvre/g,'Charges');
html=html.replace(/(<button class="tab" data-tab="achats">)Achats(<\/button>)/i,'$1Charges$2');
html=html.replace(/Ajouter un achat\s*\/\s*une facture/gi,'Ajouter un achat / une charge');
html=html.replace('const TYPES_DOC = ["BL","Facture","Devis","Achat direct","Facture sous-traitant","Avoir"];','const TYPES_DOC = ["BL","Facture","Devis","Achat direct","Stock","Facture sous-traitant","Avoir"];');
html=html.replace('const BADGE_DOC={"BL":"b-bl","Facture":"b-fac","Devis":"b-df","Achat direct":"b-ad","Facture sous-traitant":"b-fst","Avoir":"b-avoir"};','const BADGE_DOC={"BL":"b-bl","Facture":"b-fac","Devis":"b-df","Achat direct":"b-ad","Stock":"b-doc","Facture sous-traitant":"b-fst","Avoir":"b-avoir"};');
html=html.replace(/<span class="sync" id="syncState"[^>]*>.*?<\/span>/i,'<span class="sync" id="yayaVersion">'+YAYA_VERSION+'</span><span class="sync" id="syncState" style="display:none"></span>');
const css=`
.hdr{background:#1e3a8a!important;color:#fff!important;display:flex!important;align-items:center!important;justify-content:flex-start!important;padding:7px 12px!important;border-bottom:1px solid rgba(255,255,255,.12)!important;gap:8px!important;white-space:nowrap!important;position:sticky!important;top:0!important;z-index:100!important;overflow-x:auto!important;flex-wrap:nowrap!important;min-height:42px!important;box-shadow:none!important}.hdr .brand{display:flex!important;align-items:center!important;gap:8px!important;flex-wrap:nowrap!important;flex-shrink:0!important;margin-right:4px!important;padding-right:12px!important;border-right:1px solid rgba(255,255,255,.25)!important;height:24px!important}.hdr .brand b{font-size:13px!important;font-weight:800!important;line-height:1!important;white-space:nowrap!important}.hdr .brand span{font-size:9px!important;font-weight:700!important;letter-spacing:.12em!important;color:#f2c21a!important;white-space:nowrap!important;text-transform:uppercase!important}.hdr .tabs{display:flex!important;align-items:center!important;gap:8px!important;margin:0!important;padding:0!important;flex:0 0 auto!important;flex-wrap:nowrap!important;justify-content:flex-start!important}.hdr .tab{width:92px!important;height:28px!important;min-height:28px!important;padding:0 8px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;box-sizing:border-box!important;border:1px solid rgba(255,255,255,.42)!important;border-radius:5px!important;color:#fff!important;font-size:10px!important;font-weight:700!important;cursor:pointer!important;flex-shrink:0!important;white-space:nowrap!important;background:transparent!important;box-shadow:none!important}.hdr .tab:hover{background:rgba(255,255,255,.10)!important}.hdr .tab.on{background:rgba(255,255,255,.18)!important;border:1px solid rgba(255,255,255,.42)!important;border-bottom:2px solid #f59e0b!important;color:#fff!important;box-shadow:none!important}.hdr #yayaVersion{font-size:9px!important;opacity:.65!important;font-weight:700!important;flex-shrink:0!important;padding:0 3px!important;margin:0!important;color:#fff!important;display:flex!important;align-items:center!important}
/* V107 : bouton création + recherche sur une seule ligne, sans icône orpheline */
.yaya-chantier-tools{display:flex!important;align-items:center!important;gap:12px!important;width:100%!important;margin-bottom:12px!important}.yaya-chantier-tools .btnp{flex:0 0 auto!important;white-space:nowrap!important;margin:0!important}.yaya-chantier-tools .yaya-search-wrap{position:relative!important;flex:1 1 auto!important;min-width:220px!important;margin:0!important}.yaya-chantier-tools .yaya-search-wrap input{width:100%!important;margin:0!important}
@media(max-width:650px){.yaya-chantier-tools{flex-wrap:wrap!important}.yaya-chantier-tools .yaya-search-wrap{flex-basis:100%!important}}
.overlay{align-items:center!important;justify-content:center!important;padding:24px!important;background:rgba(13,32,54,.58)!important;backdrop-filter:blur(3px)}.modal{width:min(620px,calc(100vw - 32px))!important;max-width:620px!important;max-height:calc(100vh - 48px)!important;overflow-y:auto!important;background:#fff!important;border-radius:18px!important;padding:22px!important;border:1px solid rgba(22,45,73,.10)!important;box-shadow:0 24px 70px rgba(13,32,54,.30)!important}.modal h5{margin:0 0 18px!important;padding-bottom:13px!important;min-height:38px;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:16px;border-bottom:1px solid rgba(22,45,73,.10);color:#162D49!important;font-size:16px!important;font-weight:750!important}.modal h5 button{flex:0 0 auto;min-height:34px;padding:6px 14px!important;border:1px solid rgba(22,45,73,.16)!important;border-radius:9px!important;background:#fff!important;color:#536273!important;font-size:12px!important;font-weight:650!important}.modal .mrow{display:flex!important;gap:10px!important;align-items:center!important;margin-top:10px!important}.modal .inp,.modal .msel,.modal .mnum{min-height:40px!important;border:1px solid rgba(22,45,73,.22)!important;border-radius:9px!important;background:#fff!important;color:#162D49!important;padding:9px 11px!important;outline:none!important}.modal .inp:focus,.modal .msel:focus,.modal .mnum:focus{border-color:#C9A227!important;box-shadow:0 0 0 3px rgba(201,162,39,.14)!important}.modal .btnp,.modal .btn2{min-height:38px!important;border-radius:9px!important;font-weight:650!important}.modal .btnp.go{background:#2E7D46!important}.modal .mfoot{padding-top:12px!important;margin-top:16px!important;border-top:1px solid rgba(22,45,73,.08);display:flex!important;gap:10px!important}.yaya-rent-pct{font-weight:850!important}.rent-high{color:#15803d!important}.rent-good{color:#65a30d!important}.rent-watch{color:#d97706!important}.rent-low{color:#dc2626!important}.yaya-add-charge{margin-left:8px!important}
`;
html=html.replace('</style>',css+'</style>');
html=html.replace('</body>',`<script>
function openChargeForChantier(cid){try{tab='achats';render();setTimeout(()=>{if(typeof openAchatModal==='function')openAchatModal();setTimeout(()=>{const ch=document.getElementById('acCh');if(ch)ch.value=cid;},0);},0);}catch(e){console.error(e);}}
function alignChantierTools(){const pane=document.getElementById('pane-chantiers');if(!pane)return;const search=pane.querySelector('input[placeholder*="Rechercher un chantier"]');if(!search)return;let createBtn=[...pane.querySelectorAll('button')].find(b=>(b.textContent||'').includes('Créer un chantier'));if(!createBtn)return;if(createBtn.closest('.yaya-chantier-tools'))return;const searchWrap=search.parentElement;const tools=document.createElement('div');tools.className='yaya-chantier-tools';createBtn.parentNode.insertBefore(tools,createBtn);tools.appendChild(createBtn);const sw=document.createElement('div');sw.className='yaya-search-wrap';searchWrap.parentNode.insertBefore(sw,searchWrap);while(searchWrap.firstChild)sw.appendChild(searchWrap.firstChild);tools.appendChild(sw);if(searchWrap!==pane)searchWrap.remove();}
function applyYayaPatches(){alignChantierTools();document.querySelectorAll('.stat b').forEach(el=>{const t=(el.textContent||'').trim();if(!/^-?\\d+%$/.test(t))return;const pct=parseInt(t,10);el.classList.add('yaya-rent-pct');el.classList.remove('rent-high','rent-good','rent-watch','rent-low');el.classList.add(pct>=30?'rent-high':pct>=20?'rent-good':pct>=10?'rent-watch':'rent-low');});document.querySelectorAll('.stat small').forEach(el=>{const t=(el.textContent||'').trim().toLowerCase();if(t.includes('main-d')&&(t.includes('oeuvre')||t.includes('œuvre')))el.textContent='CHARGES';});document.querySelectorAll('button').forEach(btn=>{if((btn.textContent||'').trim().replace(/^\\+\\s*/,'')==='Ajouter un achat / une facture')btn.innerHTML=btn.innerHTML.replace('Ajouter un achat / une facture','Ajouter un achat / une charge');});document.querySelectorAll('button[onclick*="openAvenant"]').forEach(btn=>{const wrap=btn.parentElement;if(!wrap||wrap.querySelector('.yaya-add-charge'))return;const oc=btn.getAttribute('onclick')||'';const m=oc.match(/openAvenant\\(['\\"]([^'\\"]+)['\\"]\\)/);if(!m)return;const b=document.createElement('button');b.className='btn2 yaya-add-charge';b.textContent='+ Charge';b.onclick=()=>openChargeForChantier(m[1]);btn.insertAdjacentElement('afterend',b);});}
const _render=window.render;if(typeof _render==='function')window.render=function(){const r=_render.apply(this,arguments);setTimeout(applyYayaPatches,0);return r};new MutationObserver(()=>applyYayaPatches()).observe(document.documentElement,{childList:true,subtree:true});setTimeout(applyYayaPatches,150);
<\/script></body>`);
document.open();document.write(html);document.close();
}catch(e){document.getElementById('boot').textContent='Erreur de chargement : '+e.message}})();
</script></body></html>
