<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yaya — AB RENOV 35</title></head><body><div style="font-family:system-ui;padding:24px">Chargement de Yaya…</div><script>
(async()=>{
  const source=await fetch('index-legacy.html?v=marcheht-1',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('legacy '+r.status);return r.text();});
  const patch=`<script>
(function(){
  function ready(){
    try{return typeof S!=='undefined' && Array.isArray(S.chantiers) && typeof render==='function' && typeof apiPost==='function';}catch(e){return false;}
  }
  function chantierIdFromCard(card){
    const el=card&&card.querySelector('[onclick*="editMontantDevis"]');
    const s=el&&el.getAttribute('onclick')||'';
    const m=s.match(/editMontantDevis\\(['\"]([^'\"]+)/);
    return m?m[1]:null;
  }
  function decorateMarche(){
    document.querySelectorAll('.seclabel').forEach(bar=>{
      const spans=bar.querySelectorAll('span');
      if(spans.length<2)return;
      const lib=(spans[0].textContent||'').trim().toLowerCase();
      if(lib!=='marché'&&lib!=='marche')return;
      const val=spans[1];
      if(val.dataset.marcheEditable==='1')return;
      const card=bar.closest('.card');
      const cid=chantierIdFromCard(card);
      if(!cid)return;
      val.dataset.marcheEditable='1';
      val.style.cursor='pointer';
      val.style.textDecoration='underline dotted';
      val.style.textUnderlineOffset='3px';
      val.title='Modifier le montant officiel du marché HT';
      val.addEventListener('click',()=>window.editMontantMarche(cid));
    });
  }
  function installReloadButton(){
    if(document.getElementById('yayaReloadBtn'))return;
    const hdr=document.querySelector('.hdr');
    const tabs=hdr&&hdr.querySelector('.tabs');
    if(!hdr||!tabs)return;
    const btn=document.createElement('button');
    btn.id='yayaReloadBtn';
    btn.type='button';
    btn.className='tab';
    btn.textContent='↻ Recharger';
    btn.title='Recharger la page (F5)';
    btn.setAttribute('aria-label','Recharger la page');
    btn.style.padding='5px 8px';
    btn.style.fontSize='11px';
    btn.style.opacity='.72';
    btn.style.flexShrink='0';
    btn.addEventListener('click',()=>window.location.reload());
    tabs.insertAdjacentElement('afterend',btn);
  }
  function install(){
    if(!ready())return setTimeout(install,120);
    installReloadButton();
    S.chantiers.forEach(c=>{c.montantMarcheHT=Number(c.montantMarcheHT)||0;});
    totalDevis=function(c){return Number(c&&c.montantMarcheHT)||0;};
    window.editMontantMarche=async function(cid){
      const c=chantierById(cid);if(!c)return;
      const v=prompt('Montant officiel du marché HT (en euros) :',Number(c.montantMarcheHT)||0);
      if(v===null)return;
      const propre=String(v).trim().replace(/\\s/g,'').replace(',','.');
      if(propre===''){toast('Indique un montant HT',true);return;}
      const montant=Number(propre);
      if(!Number.isFinite(montant)||montant<0){toast('Montant HT invalide',true);return;}
      const avant=Number(c.montantMarcheHT)||0;
      c.montantMarcheHT=montant;
      render();decorateMarche();
      if(await apiPost('setChantiers',S.chantiers))toast('Montant du marché HT enregistré ✓');
      else{c.montantMarcheHT=avant;render();decorateMarche();}
    };
    const obs=new MutationObserver(()=>decorateMarche());
    obs.observe(document.body,{childList:true,subtree:true});
    render();decorateMarche();
  }
  install();
})();
<\/script>`;
  const out=source.includes('</body>')?source.replace('</body>',patch+'</body>'):source+patch;
  document.open();document.write(out);document.close();
})().catch(e=>{document.body.innerHTML='<pre style="padding:20px;color:#b42318">Erreur chargement Yaya : '+String(e)+'</pre>';});
</script></body></html>
