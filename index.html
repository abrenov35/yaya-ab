<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"><title>Yaya — AB RENOV 35</title></head>
<body><div id="boot" style="font-family:system-ui;padding:30px;text-align:center;color:#162D49">Chargement de Yaya…</div>
<script>
(async()=>{try{
const YAYA_VERSION='V102';
const base='https://raw.githubusercontent.com/abrenov35/yaya-ab/362bf7657744a0bf32e449940ed6066402fb4afc/index.html';
let html=await (await fetch(base,{cache:'no-store'})).text();
html=html.replace(/<meta name="viewport"[^>]*>/i,'<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">');
html=html.replace('<div id="loader" style="display: none;">','<div id="loader" style="display: flex;">');
html=html.replace('expChantiers.clear(); expChantiers.add(nid);','expChantiers.clear();');
html=html.replace(/MAIN-D\\?['’]OEUVRE/g,'CHARGES').replace(/Main-d\\?['’]oeuvre/g,'Charges').replace(/MAIN-D\\?['’]ŒUVRE/g,'CHARGES').replace(/Main-d\\?['’]œuvre/g,'Charges');
html=html.replace(/(<button class="tab" data-tab="achats">)Achats(<\/button>)/i,'$1Charges$2');
html=html.replace(/Ajouter un achat\s*\/\s*une facture/gi,'Ajouter un achat / une charge');
html=html.replace('const TYPES_DOC = ["BL","Facture","Devis","Achat direct","Facture sous-traitant","Avoir"];','const TYPES_DOC = ["BL","Facture","Devis","Achat direct","Stock","Facture sous-traitant","Avoir"];');
html=html.replace('const BADGE_DOC={"BL":"b-bl","Facture":"b-fac","Devis":"b-df","Achat direct":"b-ad","Facture sous-traitant":"b-fst","Avoir":"b-avoir"};','const BADGE_DOC={"BL":"b-bl","Facture":"b-fac","Devis":"b-df","Achat direct":"b-ad","Stock":"b-doc","Facture sous-traitant":"b-fst","Avoir":"b-avoir"};');
html=html.replace(/<span class="sync" id="syncState"[^>]*>.*?<\/span>/i,'<span class="sync" id="yayaVersion">'+YAYA_VERSION+'</span><span class="sync" id="syncState" style="display:none"></span>');
const css=`
/* V102 — dimensions calées sur le bandeau AB Planning */
.topbar{height:68px!important;min-height:68px!important;padding:0 20px!important;background:#243f9b!important;display:flex!important;align-items:center!important;gap:12px!important;box-shadow:none!important;overflow:hidden!important}
.brand{font-size:20px!important;line-height:1!important;font-weight:900!important;letter-spacing:0!important;white-space:nowrap!important;display:flex!important;align-items:center!important;height:40px!important;padding-right:18px!important;border-right:1px solid rgba(255,255,255,.32)!important}.brand small{font-size:11px!important;font-weight:750!important;letter-spacing:.15em!important;color:#f2c21a!important;margin-left:12px!important}.tabs{display:flex!important;align-items:center!important;gap:12px!important;margin:0!important;flex:0 0 auto!important}.tab{height:44px!important;min-height:44px!important;padding:0 24px!important;border:1px solid rgba(255,255,255,.38)!important;border-radius:8px!important;background:rgba(255,255,255,.03)!important;color:#fff!important;font-size:15px!important;line-height:1!important;font-weight:800!important;box-shadow:none!important;white-space:nowrap!important}.tab:hover{background:rgba(255,255,255,.09)!important}.tab.active{background:rgba(255,255,255,.14)!important;color:#fff!important;border-color:rgba(255,255,255,.45)!important;box-shadow:inset 0 -3px 0 #f2b800!important}#yayaVersion{margin-left:4px!important;color:rgba(255,255,255,.70)!important;font-size:12px!important;line-height:1!important;font-weight:850!important;letter-spacing:0!important;white-space:nowrap!important;display:flex!important;align-items:center!important}
.overlay{align-items:center!important;justify-content:center!important;padding:24px!important;background:rgba(13,32,54,.58)!important;backdrop-filter:blur(3px)}
.modal{width:min(620px,calc(100vw - 32px))!important;max-width:620px!important;max-height:calc(100vh - 48px)!important;overflow-y:auto!important;background:#fff!important;border-radius:18px!important;padding:22px!important;border:1px solid rgba(22,45,73,.10)!important;box-shadow:0 24px 70px rgba(13,32,54,.30)!important}.modal h5{margin:0 0 18px!important;padding-bottom:13px!important;min-height:38px;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:16px;border-bottom:1px solid rgba(22,45,73,.10);color:#162D49!important;font-size:16px!important;font-weight:750!important}.modal h5 button{flex:0 0 auto;min-height:34px;padding:6px 14px!important;border:1px solid rgba(22,45,73,.16)!important;border-radius:9px!important;background:#fff!important;color:#536273!important;font-size:12px!important;font-weight:650!important}.modal .mrow{display:flex!important;gap:10px!important;align-items:center!important;margin-top:10px!important}.modal .inp,.modal .msel,.modal .mnum{min-height:40px!important;border:1px solid rgba(22,45,73,.22)!important;border-radius:9px!important;background:#fff!important;color:#162D49!important;padding:9px 11px!important;outline:none!important}.modal .inp:focus,.modal .msel:focus,.modal .mnum:focus{border-color:#C9A227!important;box-shadow:0 0 0 3px rgba(201,162,39,.14)!important}.modal .btnp,.modal .btn2{min-height:38px!important;border-radius:9px!important;font-weight:650!important}.modal .btnp.go{background:#2E7D46!important}.modal .mfoot{padding-top:12px!important;margin-top:16px!important;border-top:1px solid rgba(22,45,73,.08);display:flex!important;gap:10px!important}
.yaya-rent-pct{font-weight:850!important}.rent-high{color:#15803d!important}.rent-good{color:#65a30d!important}.rent-watch{color:#d97706!important}.rent-low{color:#dc2626!important}.yaya-add-charge{margin-left:8px!important}
@media(max-width:900px){.topbar{height:auto!important;min-height:68px!important;padding:8px 12px!important;flex-wrap:wrap!important}.brand{border-right:0!important;padding-right:0!important}.tabs{overflow-x:auto!important;max-width:100%!important}.tab{height:40px!important;min-height:40px!important;padding:0 15px!important}#yayaVersion{margin-left:auto!important}}
`;
html=html.replace('</style>',css+'</style>');
html=html.replace('</body>',`<script>
function openChargeForChantier(cid){try{tab='achats';render();setTimeout(()=>{if(typeof openAchatModal==='function')openAchatModal();setTimeout(()=>{const ch=document.getElementById('acCh');if(ch)ch.value=cid;},0);},0);}catch(e){console.error(e);}}
function applyYayaPatches(){document.querySelectorAll('.stat b').forEach(el=>{const t=(el.textContent||'').trim();if(!/^-?\\d+%$/.test(t))return;const pct=parseInt(t,10);el.classList.add('yaya-rent-pct');el.classList.remove('rent-high','rent-good','rent-watch','rent-low');el.classList.add(pct>=30?'rent-high':pct>=20?'rent-good':pct>=10?'rent-watch':'rent-low');});document.querySelectorAll('.stat small').forEach(el=>{const t=(el.textContent||'').trim().toLowerCase();if(t.includes('main-d')&&(t.includes('oeuvre')||t.includes('œuvre')))el.textContent='CHARGES';});document.querySelectorAll('button').forEach(btn=>{if((btn.textContent||'').trim().replace(/^\\+\\s*/,'')==='Ajouter un achat / une facture')btn.innerHTML=btn.innerHTML.replace('Ajouter un achat / une facture','Ajouter un achat / une charge');});document.querySelectorAll('button[onclick*="openAvenant"]').forEach(btn=>{const wrap=btn.parentElement;if(!wrap||wrap.querySelector('.yaya-add-charge'))return;const oc=btn.getAttribute('onclick')||'';const m=oc.match(/openAvenant\\(['\\"]([^'\\"]+)['\\"]\\)/);if(!m)return;const b=document.createElement('button');b.className='btn2 yaya-add-charge';b.textContent='+ Charge';b.onclick=()=>openChargeForChantier(m[1]);btn.insertAdjacentElement('afterend',b);});}
const _render=window.render;if(typeof _render==='function')window.render=function(){const r=_render.apply(this,arguments);setTimeout(applyYayaPatches,0);return r};new MutationObserver(()=>applyYayaPatches()).observe(document.documentElement,{childList:true,subtree:true});setTimeout(applyYayaPatches,150);
<\/script></body>`);
document.open();document.write(html);document.close();
}catch(e){document.getElementById('boot').textContent='Erreur de chargement : '+e.message}})();
</script></body></html>
