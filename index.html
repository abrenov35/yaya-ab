<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"><title>Yaya — AB RENOV 35</title></head>
<body><div id="boot" style="font-family:system-ui;padding:30px;text-align:center;color:#162D49">Chargement de Yaya…</div>
<script>
(async()=>{try{
  const base='https://raw.githubusercontent.com/abrenov35/yaya-ab/4a4ac3e91fea00e99629d3e67f59865c3cf33a1b/index.html';
  let html=await (await fetch(base,{cache:'no-store'})).text();
  html=html.replace("const YAYA_VERSION='V163';","const YAYA_VERSION='V165';");
  const css=`
/* V165 — RESPONSIVE GLOBAL, CSS UNIQUEMENT. Aucun changement du lecteur de pièces. */
html,body{max-width:100%;overflow-x:hidden}
*,*::before,*::after{box-sizing:border-box}
img,svg,video,canvas{max-width:100%;height:auto}
input,select,textarea,button{max-width:100%}

@media(max-width:900px){
  .wrap,.container,main{max-width:100%!important;width:100%!important}
  .card,.panel,.pane{max-width:100%!important;min-width:0!important}
  .top,.toolbar,.actions,.filters{max-width:100%!important}
  table{max-width:100%}
  .modal{max-width:calc(100vw - 24px)!important;max-height:calc(100dvh - 24px)!important;overflow:auto!important}
}

@media(max-width:760px){
  body{font-size:13px!important}
  .wrap,.container,main{padding-left:8px!important;padding-right:8px!important}
  .card{max-width:100%!important;min-width:0!important}
  .top,.toolbar,.actions,.filters{flex-wrap:wrap!important;gap:6px!important}
  .top>*{min-width:0!important}
  .inp,.msel,.mnum,input,select,textarea{font-size:16px}
  .modal{width:calc(100vw - 16px)!important;max-width:calc(100vw - 16px)!important;max-height:calc(100dvh - 16px)!important;margin:8px!important;padding:14px!important;border-radius:14px!important}
  .modal .mrow{flex-wrap:wrap!important}
  .modal .mfoot{position:sticky!important;bottom:-14px!important;background:#fff!important;z-index:2!important;padding:10px 0 4px!important;display:flex!important;gap:8px!important}
  .modal .mfoot button{flex:1 1 auto!important}

  /* tableaux larges : scroll local au lieu de faire déborder toute la page */
  .table-wrap,.scroll,.wh-scroll{max-width:100%!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch}

  /* Charges */
  #pane-achats{max-width:100%!important;overflow-x:hidden!important}
  #pane-achats .controle-ligne,#pane-achats .charge-validee-ligne{
    width:100%!important;max-width:100%!important;min-width:0!important;
    grid-template-columns:78px minmax(0,1fr) 72px!important;
    grid-auto-rows:auto!important;gap:5px 7px!important;padding:9px 7px!important
  }
  #pane-achats .controle-ligne>*,#pane-achats .charge-validee-ligne>*{min-width:0!important;overflow:hidden!important;text-overflow:ellipsis!important}
  #pane-achats .badge{max-width:76px!important;min-width:0!important;width:auto!important}

  /* Documents : conserver le correctif V163 et empêcher tout débordement */
  #pane-documents,#pane-docs{max-width:100%!important;overflow-x:hidden!important}
  #pane-documents .card,#pane-docs .card{max-width:100%!important;min-width:0!important}

  /* Equipe */
  #pane-equipe{max-width:100%!important;overflow-x:hidden!important}
  #pane-equipe>.card>.achligne{
    width:100%!important;max-width:100%!important;min-width:0!important;
    grid-template-columns:minmax(100px,1.4fr) minmax(90px,1fr) 64px 64px 34px!important;
    gap:5px!important;padding:8px!important
  }
  #pane-equipe>.card>.achligne>*{min-width:0!important;overflow:hidden!important;text-overflow:ellipsis!important}

  /* Chantiers */
  #pane-chantiers{max-width:100%!important;overflow-x:hidden!important}
  #pane-chantiers .card{max-width:100%!important;min-width:0!important}
  #pane-chantiers .card .top{max-width:100%!important;min-width:0!important;flex-wrap:wrap!important}

  /* Heures : la grille hebdomadaire reste exploitable sur petit écran */
  .week-hours-modal{width:calc(100vw - 12px)!important;max-width:none!important}
  .wh-scroll{width:100%!important}
  .wh-grid,.wh-summary{min-width:610px!important}
}

@media(max-width:430px) and (orientation:portrait){
  .wrap,.container,main{padding-left:6px!important;padding-right:6px!important}
  .btnp,.btn2,button{min-height:34px}
  #pane-chantiers .card{padding:8px!important}
  #pane-chantiers .card .top>b:first-child{flex:1 1 65%!important}
  #pane-achats .controle-ligne,#pane-achats .charge-validee-ligne{grid-template-columns:70px minmax(0,1fr) 66px!important}
  #pane-equipe>.card>.achligne{grid-template-columns:minmax(105px,1fr) 72px 58px 34px!important}
}

@media(min-width:431px) and (max-width:900px) and (orientation:landscape){
  .modal{max-height:calc(100dvh - 12px)!important;margin:6px!important}
  .card{max-width:100%!important}
}
`;
  html=html.replace('</head>','<style>'+css+'</style></head>');
  document.open();document.write(html);document.close();
}catch(e){document.getElementById('boot').textContent='Erreur de chargement : '+e.message}})();
</script></body></html>
